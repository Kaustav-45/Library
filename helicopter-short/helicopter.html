  const g=new THREE.ExtrudeGeometry(s,{depth:3.2,bevelEnabled:false,curveSegments:4}); g.translate(0,0,-1.6);
  const af=new THREE.Mesh(g,phys(0x3a4150,{metalness:0.5})); af.position.copy(AF); af.rotation.z=-0.13; scene.add(af); }
const afFlow=[]; [-1.9,-1.3,-0.75,0.75,1.3,1.9].forEach((y0,li)=>{ for(let i=0;i<16;i++){ const s=sprite(0x4fb8ff,0.2,0); s.userData={y0,ph:i/16,z:-1.2+((li*7+i)%5)*0.6}; afFlow.push(s); } });
function flowY(x,y0){ const near=Math.exp(-x*x/3); let y=y0+(y0>0?0.35:0.12)*near/(1+Math.abs(y0)*0.5); y-=0.65*smooth(-1.2,3.5,x)/(1+Math.abs(y0)*0.45); return y; }
const afLift=makeArrow(0x4ee28a,0.14), afDown=makeArrow(0x6fd3ff,0.1);

// ---------- tandem helicopter ----------
const TD=V(160,9,0);
const tand=new THREE.Group(); tand.position.copy(TD); scene.add(tand);
const tPaint=phys(0x5b6b3a);
{ const f=new THREE.Mesh(new THREE.CapsuleGeometry(0.95,6.2,10,24),tPaint); f.rotation.z=Math.PI/2; tand.add(f);
  const py=box(1.1,1.2,0.9,tPaint); py.position.set(-3.2,1.0,0); tand.add(py); const pf=box(0.9,0.6,0.8,tPaint); pf.position.set(3.3,0.75,0); tand.add(pf);
  const g=new THREE.Mesh(new THREE.SphereGeometry(0.9,24,16,-0.9,1.8,0.3,1.0),phys(0x0d2238,{roughness:0.05})); g.position.set(3.6,0.2,0); g.rotation.y=-Math.PI/2; tand.add(g); }
const tRotors=[[3.3,1.35],[-3.2,1.85]].map(([x,y],i)=>{ const r=new THREE.Group(); r.position.set(x,y,0); tand.add(r);
  for(let k=0;k<3;k++){ const a=new THREE.Group(); a.rotation.y=k*TAU/3; r.add(a); const b=box(4.0,0.04,0.32,phys(0x30343e)); b.position.x=2.0; a.add(b); }
  const d=new THREE.Mesh(new THREE.CircleGeometry(4.1,48),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.08,side:THREE.DoubleSide,depthWrite:false})); d.rotation.x=-Math.PI/2; r.add(d); return r; });
const tArrows=tRotors.map((r,i)=>{ const a=curvedArrow(4.6,i?0xff5a5a:0x4ee28a,0.09); return a; });

// ---------- effects ----------
const down=[]; for(let i=0;i<60;i++){ const s=sprite(0xdff2ff,0.35,0); s.userData={a:rnd()*TAU,r:Math.sqrt(rnd())*4.2,ph:rnd()}; down.push(s); }
const dust=[]; for(let i=0;i<40;i++){ const s=sprite(0xd9c9a8,1.6,0,false); s.userData={a:rnd()*TAU,ph:rnd()}; dust.push(s); }
const tailAir=[]; for(let i=0;i<24;i++){ const s=sprite(0xdff2ff,0.3,0); s.userData={ph:rnd(),a:rnd()*TAU}; tailAir.push(s); }
const sparks=[]; for(let i=0;i<20;i++){ const s=sprite(0xffa040,0.25,0); s.userData={ph:rnd(),v:V(rnd()-0.5,rnd()*0.8,rnd()-0.5)}; sparks.push(s); }
const arLift=makeArrow(0x4ee28a,0.16), arWeight=makeArrow(0xff5a5a,0.16), arFwd=makeArrow(0xffc94d,0.13), arUp=makeArrow(0x4ee28a,0.1), arTail=makeArrow(0xffc94d,0.12);
const spinRotor=curvedArrow(5.2,0x4ee28a,0.1), spinBody=curvedArrow(2.4,0xff5a5a,0.1);

// ---------- timeline ----------
function integ(t0,t,f,dt=1/60){ let a=0; for(let x=t0+dt/2;x<t;x+=dt) a+=f(x)*dt; return a; }
const tFail=2.4, tS0=L(3).start+2.4, tS1=L(4).start+0.8;
const tailOff=t=>(t>tFail&&t<L(1).start)||(t>tS0&&t<tS1);
function yawAt(t){
  if(t<L(1).start){ const u=Math.max(0,t-tFail); return -0.5*u*u; }
  let y=0; const u=clamp(t-tS0,0,tS1-tS0); y+=-0.28*u*u*(1-smooth(tS1,tS1+2.2,t));
  y+=0.9*win(L(5).start+0.5,L(5).start+2.8,t,0.9)-0.9*win(L(5).start+2.8,L(5).end+0.3,t,0.9);
  return y; }
const vx=t=>7*win(L(6).start+0.8,L(7).start+0.4,t,1.4)+8*smooth(L(10).start+0.3,L(10).start+2,t);
function heliY(t){ let y=6;
  if(t>=L(1).start && t<L(3).start) y=lerp(2.2,6,smooth(L(2).start+2.6,L(2).end,t));
  if(t>=L(7).start) y=lerp(6,3.6,smooth(L(7).end-0.4,L(8).start+1.2,t));
  if(t>=L(10).start) y=lerp(3.6,8,smooth(L(10).start+0.3,L(10).end,t));
  return y+0.08*Math.sin(t*1.7); }
const pitchAt=t=>-0.2*win(L(6).start+0.4,L(7).start+0.6,t,1.0)-0.18*smooth(L(10).start+0.2,L(10).start+1.4,t);
const collective=t=>0.1+0.2*win(L(2).start+2.2,L(2).end+0.4,t,0.8);
const cyclic=t=>0.32*win(L(7).start+0.8,L(7).end+0.3,t,0.6)+0.1*win(L(6).start+0.4,L(7).start,t,0.8);
let hp=V(0,6,0);

// ---------- labels ----------
const labelsEl=document.getElementById('labels'), LBL=[];
function label(text,cls,p,from,to){ const d=document.createElement('div'); d.className='label '+cls; d.textContent=text; labelsEl.appendChild(d); LBL.push({d,p:(typeof p==='function')?p:()=>p,from,to}); }
const onH=(x,y,z=0)=>()=>H1.body.localToWorld(V(x,y,z));
label("Tail rotor","hot",onH(-4.5,2.2,0.3),0.6,tFail+0.4);
label("Blade = a spinning wing","big",AF.clone().add(V(0,2.6,0)),L(1).start+0.8,L(1).end+0.2);
label("Air pushed DOWN","cold",AF.clone().add(V(3.4,-2.6,0)),L(1).start+3.4,L(1).end+0.2);
label("LIFT","green big",()=>hp.clone().add(V(0.9,5.2,0)),L(2).start+1.6,L(2).end+0.3);
label("WEIGHT","red",()=>hp.clone().add(V(0.9,-2.6,0)),L(2).start+2.2,L(2).end+0.3);
label("Rotor spins this way","green",()=>hp.clone().add(V(0,3.0,-5.4)),L(3).start+1.0,L(3).end+0.3);
label("Body spins the OTHER way!","red big",()=>hp.clone().add(V(0,2.6,2.9)),L(3).start+3.0,L(3).end+0.6);
label("Tail push cancels the spin","",()=>H1.body.localToWorld(V(-4.5,2.3,0.9)),L(4).start+2.2,L(4).end+0.2);
label("Turn left","green",()=>hp.clone().add(V(-2,2.8,0)),L(5).start+0.8,L(5).start+2.8);
label("Turn right","green",()=>hp.clone().add(V(2,2.8,0)),L(5).start+3.0,L(5).end+0.2);
label("Rotor tilts forward","",()=>hp.clone().add(V(0,4.4,0)),L(6).start+1.2,L(6).end+0.2);
label("Forward pull","volt",()=>hp.clone().add(V(4.4,2.4,0)),L(6).start+2.6,L(6).end+0.2);
label("Swashplate","big",()=>H1.body.localToWorld(V(0.2,1.5,0.9)),L(7).start+1.2,L(7).end+0.2);
label("Blade angle changes every turn","",()=>H1.body.localToWorld(V(1.4,2.9,0)),L(7).start+3.0,L(7).end+0.2);
label("Lift = Weight → hover","green big",()=>hp.clone().add(V(0,4.8,0)),L(8).start+1.4,L(8).end+0.3);
label("Opposite spins cancel!","big",TD.clone().add(V(0,5.6,0)),L(9).start+3.4,L(9).end+0.4);

const FACTS={1:"Blades are airfoils, curved on top like an airplane wing.",
 2:"Rotor blade tips can move at over 700 km/h, close to the speed of sound.",
 3:"This twisting force is called torque reaction.",
 4:"The tail rotor can use 10–15% of the engine's power just to stop the spin.",
 5:"The pilot controls the tail rotor with foot pedals.",
 6:"The pilot tilts the rotor with a stick called the cyclic.",
 7:"Each blade changes its angle once on every single turn of the rotor.",
 8:"Hummingbirds hover the same way: by pushing air straight down.",
 9:"The giant CH-47 Chinook uses two rotors and no tail rotor at all."};

// ---------- camera ----------
const SHOTS=[
  [0,            t=>[hp.clone().add(V(7.5,2.4,11.5)),hp.clone().add(V(-0.8,0.6,0))]],
  [L(1).start,   t=>[AF.clone().add(V(0.5,1.0,10.5)),AF.clone().add(V(0.6,-1.2,0))]],
  [L(2).start,   t=>[hp.clone().add(V(7,0.8,11.5)),hp.clone().add(V(0,0.2,0))]],
  [L(3).start,   t=>[hp.clone().add(V(1.5,13.5,6.5)),hp.clone().add(V(0,0,0.6))]],
  [L(4).start,   t=>[hp.clone().add(V(-1.2,7.5,8.5)),hp.clone().add(V(-1.8,0.2,0.6))]],
  [L(5).start,   t=>[hp.clone().add(V(3,9.5,9.5)),hp.clone().add(V(-0.8,0.2,0))]],
  [L(6).start,   t=>[hp.clone().add(V(2.5,2.6,14)),hp.clone().add(V(1.2,0.8,0))]],
  [L(7).start,   t=>[hp.clone().add(V(2.8,4.0,6.2)),hp.clone().add(V(0.2,1.6,0))]],
  [L(8).start,   t=>[hp.clone().add(V(6,1.4,10)),hp.clone().add(V(0,0.4,0))]],
  [L(9).start,   t=>[TD.clone().add(V(3,8,19)),TD.clone().add(V(0,0.6,0))]],
  [L(10).start,  t=>[hp.clone().add(V(6.5,1.6,12)),hp.clone().add(V(0.5,0.2,0))]],
];
function camAt(t){
  let i=0; while(i<SHOTS.length-1 && t>=SHOTS[i+1][0]) i++;
  const Av=SHOTS[i][1](t); let p=Av[0], g=Av[1];
  if(i<SHOTS.length-1){ const N=SHOTS[i+1]; const k=smooth(N[0]-1.4,N[0]+0.1,t); if(k>0){ const Bv=N[1](t); p=p.clone().lerp(Bv[0],k); g=g.clone().lerp(Bv[1],k); } }
  const shake=(t>tFail&&t<L(1).start)?0.06*Math.sin(t*37):0;
  camera.position.set(p.x+Math.sin(t*0.3)*0.4+shake,p.y+Math.sin(t*0.2)*0.15+shake,p.z); camera.lookAt(g);
}
const CHIPS={hook:"",blade:"BLADES ARE WINGS",lift:"LIFT",torque:"THE SPIN PROBLEM",tail:"THE TAIL ROTOR",yaw:"TURNING",tilt:"FLYING FORWARD",swash:"THE SWASHPLATE",hover:"HOVERING",twin:"NO TAIL ROTOR?",outro:""};
const sub=document.getElementById('sub'), chip=document.getElementById('chip'), head=document.getElementById('head');
const big=document.getElementById('big'), big1=document.getElementById('big1'), big2=document.getElementById('big2'), warn=document.getElementById('warn');
const fact=document.getElementById('fact'), factv=document.getElementById('factv'); let factOp=0, lastFact=-1;
const tmp=V(0,0,0); let lastLine=-2;

function renderAt(t){
  t=clamp(t,0,DURATION);
  // helicopter state
  hp.set(integ(0,t,vx)+0.18*Math.sin(t*0.53)+0.07*Math.sin(t*1.7),heliY(t)+0.05*Math.sin(t*1.13),0.16*Math.sin(t*0.41)+0.06*Math.sin(t*1.3));
  const yawRate=clamp((yawAt(t+0.04)-yawAt(t))/0.04,-1.5,1.5), accel=(vx(t+0.1)-vx(t))/0.1;
  const roll=0.035*Math.sin(t*0.9)+0.02*Math.sin(t*2.1)-0.09*yawRate*(t>L(1).start?1:0.15);
  H1.heli.position.copy(hp); H1.body.rotation.set(roll,yawAt(t),pitchAt(t)-0.02*accel+0.02*Math.sin(t*0.7),'YXZ');
  sun.position.copy(hp).add(V(-9,16,11)); sun.target.position.copy(hp);
  const rAng=integ(0,t,x=>7.2); H1.rotor.rotation.y=rAng;
  const coll=collective(t), cyc=cyclic(t);
  H1.blades.forEach((b,i)=>{ const psi=rAng+i*TAU/4; b.rotation.x=coll+cyc*Math.cos(psi); });
  H1.swash.rotation.z=-cyc*0.6; H1.swUp.rotation.z=rAng; H1.swUpM.emissiveIntensity=0.6*win(L(7).start+0.8,L(7).end,t);
  const tOn=tailOff(t)?0:1; const tAng=integ(0,t,x=>tailOff(x)?0:24); H1.tail.rotation.z=tAng; H1.tdisc.material.opacity=0.12*tOn;
  H1.disc.material.opacity=0.85+0.1*Math.sin(t*3);
  H1.beacon.material.opacity=(Math.sin(t*6)>0.6)?0.95:0.1;
  camAt(t);

  // hook: tail failure sparks + warning
  const sp=(t>tFail&&t<L(1).start)?1:0;
  sparks.forEach(s=>{ const d=s.userData, k=(t*1.6+d.ph)%1; s.position.copy(H1.body.localToWorld(V(-4.5,1.35,0.15))).addScaledVector(d.v,k*1.6); s.material.opacity=sp*(1-k); });
  warn.style.opacity=sp*(0.65+0.35*Math.sin(t*12));
  // airfoil flow
  const afOn=win(L(1).start,L(1).end+0.6,t,0.5);
  afFlow.forEach(s=>{ const d=s.userData, k=(t*0.32+d.ph)%1; const x=-6.5+k*13; s.position.copy(AF).add(V(x,flowY(x,d.y0),d.z)); s.material.opacity=afOn*0.9*Math.sin(k*Math.PI); });
  afLift.set(AF.clone().add(V(-0.2,0.5,1.7)),V(0,1,0),2.0*smooth(L(1).start+3.8,L(1).start+4.6,t),afOn);
  afDown.set(AF.clone().add(V(3.6,-0.6,1.7)),V(0.35,-1,0),1.4,afOn*smooth(L(1).start+3.0,L(1).start+3.6,t));
  // downwash + dust
  const dwOn=Math.max(win(L(2).start,L(2).end+0.4,t), win(L(8).start,L(8).end+0.4,t), 0.6*win(0,L(1).start,t));
  down.forEach(s=>{ const d=s.userData, k=(t*0.9+d.ph)%1; const r=d.r*(1+k*0.35); s.position.set(hp.x+Math.cos(d.a)*r,hp.y+2.1-k*hp.y*1.05,Math.sin(d.a)*r); s.material.opacity=dwOn*0.7*Math.sin(k*Math.PI); });
  const dustOn=win(L(8).start,L(8).end+0.4,t)+0.7*win(L(2).start,L(2).start+3.5,t);
  dust.forEach(s=>{ const d=s.userData, k=(t*0.35+d.ph)%1; const r=2.5+k*6; s.position.set(hp.x+Math.cos(d.a)*r,0.4+k*0.8,Math.sin(d.a)*r); s.scale.setScalar(1.2+k*2.5); s.material.opacity=dustOn*0.45*Math.sin(k*Math.PI); });
  // lift/weight
  const lw=win(L(2).start+1.4,L(2).end+0.4,t), hv=win(L(8).start+1.0,L(8).end+0.4,t);
  const liftLen=lerp(2.4,3.4,smooth(L(2).start+2.4,L(2).start+3.2,t))*(t<L(3).start?1:0)+2.6*hv;
  arLift.set(hp.clone().add(V(0.2,2.5,0)),V(0,1,0),t<L(3).start?liftLen:2.6,Math.max(lw,hv));
  arWeight.set(hp.clone().add(V(0.3,-0.4,0)),V(0,-1,0),t<L(3).start?2.4:2.6,Math.max(lw,hv)*smooth(L(2).start+2.0,L(2).start+2.6,t)+hv);
  // spin problem arrows (top view)
  const sr=win(L(3).start+0.8,L(3).end+0.4,t), sb=win(L(3).start+2.8,L(4).start+1.0,t);
  spinRotor.position.copy(hp).add(V(0.2,2.6,0)); spinRotor.rotation.set(-Math.PI/2,0,t*0.6); spinRotor.userData.m.opacity=sr;
  spinBody.position.copy(hp).add(V(0,1.2,0)); spinBody.rotation.set(Math.PI/2,0,-t*0.6); spinBody.userData.m.opacity=sb;
  // tail push
  const tp=Math.max(win(L(4).start+1.2,L(4).end+0.3,t), win(L(5).start,L(5).end,t)*0.8);
  const tw=H1.body.localToWorld(V(-4.55,1.35,0.12)), side=V(0,0,1).applyQuaternion(H1.body.getWorldQuaternion(new THREE.Quaternion()));
  arTail.set(tw.clone().addScaledVector(side,0.3),side,1.6,tp);
  tailAir.forEach(s=>{ const d=s.userData, k=(t*1.4+d.ph)%1; s.position.copy(tw).addScaledVector(side,-0.2-k*2.4).add(V(Math.cos(d.a)*0.35*(1+k),Math.sin(d.a)*0.35*(1+k),0)); s.material.opacity=tp*0.8*(1-k); });
  // forward flight arrows
  const ff=win(L(6).start+1.4,L(6).end+0.4,t);
  const nrm=V(0,1,0).applyQuaternion(H1.body.getWorldQuaternion(new THREE.Quaternion())).applyAxisAngle(V(0,0,1),-0.08);
  const top=hp.clone().add(V(0.2,2.5,0));
  arLift.visible=arLift.visible; if(ff>0.01){ arLift.set(top,nrm,3.0,ff); arFwd.set(top,V(1,0,0),3.0*Math.abs(nrm.x)*3,ff*smooth(L(6).start+2.4,L(6).start+3.0,t)); arUp.set(top,V(0,1,0),3.0*nrm.y,ff*0.6); }
  else { arFwd.set(top,V(1,0,0),1,0); arUp.set(top,V(0,1,0),1,0); }
  // tandem
  const tAng2=integ(0,t,x=>6.5); tRotors[0].rotation.y=tAng2; tRotors[1].rotation.y=-tAng2;
  const ta=win(L(9).start+1.6,L(9).end+0.5,t);
  tArrows.forEach((a,i)=>{ a.position.copy(tRotors[i].getWorldPosition(new THREE.Vector3())).add(V(0,0.4,0)); a.rotation.set(-Math.PI/2,0,(i?-1:1)*t*0.8); a.scale.x=i?-1:1; a.userData.m.opacity=ta; });
  tand.position.y=TD.y+0.1*Math.sin(t*1.5);

  renderer.render(scene,camera);

  // overlay
  let li=-1; LINES.forEach((l,i)=>{ if(t>=l.start-0.05) li=i; });
  const line=li>=0?LINES[li]:null;
  if(li!==lastLine){ sub.textContent=line?line.text:''; const cc=line&&CHIPS[line.m]; chip.textContent=cc||''; chip.style.display=cc?'inline-block':'none'; lastLine=li; }
  sub.style.opacity=(line && t<=line.end+0.3 && line.m!=='outro')?1:0;
  { let fo=0, fi=-1; for(const k in FACTS){ const l=L(+k), nx=LINES[+k+1]; const end=nx?nx.start-0.15:l.end; const o=win(l.start+0.9,end,t,0.35); if(o>fo){ fo=o; fi=+k; } }
    if(fi!==lastFact && fi>=0){ factv.textContent=FACTS[fi]; lastFact=fi; } factOp=fo; fact.style.opacity=fo; }
  head.style.opacity=smooth(L(1).start-0.6,L(1).start,t)*(1-smooth(L(10).start-0.4,L(10).start,t));
  const intro=1-smooth(L(1).start-0.8,L(1).start-0.2,t), outro=smooth(L(10).start-0.2,L(10).start+0.4,t);
  if(outro>0){ big1.textContent="SPINNING WINGS + A BALANCING TAIL"; big2.innerHTML="THAT'S HOW IT <em>FLIES!</em>"; big.style.opacity=outro; }
  else { big1.textContent="IF THIS TINY ROTOR STOPS..."; big2.innerHTML="THE WHOLE HELICOPTER<br><em>SPINS!</em>"; big.style.opacity=intro*smooth(0.2,0.8,t); }
  document.getElementById('bar').style.width=(t/DURATION*100)+'%';
  const cw=W(), chh=H();
  LBL.forEach(l=>{ const o=win(l.from,l.to,t,0.3); if(o<0.01){ l.d.style.display='none'; return; }
    tmp.copy(l.p()).project(camera); l.d.style.display=tmp.z<1?'block':'none'; l.d.style.opacity=o;
    const hw=l.d.offsetWidth/2+8; l.d.style.left=clamp((tmp.x+1)/2*cw,hw,cw-hw)+'px'; l.d.style.top=clamp((1-tmp.y)/2*chh,chh*(factOp>0.05?0.29:0.24),chh*0.66)+'px'; });
}
window.renderAt=renderAt; window.DURATION=DURATION;
function resize(){ renderer.setSize(W(),H()); camera.aspect=W()/H(); camera.fov=camera.aspect<1?62:45; camera.updateProjectionMatrix(); }
window.addEventListener('resize',resize); resize();
if(location.hash==='#capture'){ document.body.classList.add('capture'); renderAt(0); }
else { let start=performance.now(); document.getElementById('replay').onclick=()=>{start=performance.now();};
  (function loop(){ renderAt(Math.min((performance.now()-start)/1000,DURATION)); requestAnimationFrame(loop); })(); }
})();
</script>
