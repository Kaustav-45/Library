<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How a Piston Engine Works</title>
<style>
  :root { --ink:#f4f7fb; --accent:#ffc94d; --cold:#6fd3ff; --hot:#ff7a3d; }
  html,body { margin:0; height:100%; background:#0d1424; overflow:hidden;
    font-family:"Segoe UI", Roboto, Helvetica, Arial, sans-serif; color:var(--ink); }
  #stage { position:fixed; inset:0; } canvas { display:block; }
  #shade { position:absolute; left:0; right:0; bottom:0; height:44%; pointer-events:none;
    background:linear-gradient(to top, rgba(6,9,18,.3) 0%, rgba(6,9,18,.9) 30%, rgba(6,9,18,.45) 62%, rgba(6,9,18,0) 100%); }
  #topshade { position:absolute; left:0; right:0; top:0; height:21%; pointer-events:none;
    background:linear-gradient(to bottom, rgba(6,9,18,.88), rgba(6,9,18,0)); }
  #head { position:absolute; top:5%; left:0; right:0; text-align:center; }
  #head .t { font-size:26px; font-weight:900; letter-spacing:1px; text-shadow:0 3px 14px rgba(0,0,0,.7); }
  #steps { display:flex; justify-content:center; gap:5px; margin-top:10px; flex-wrap:wrap; padding:0 4%; }
  #steps span { font-weight:900; font-size:13px; letter-spacing:.5px; padding:5px 9px; border-radius:999px;
    background:rgba(255,255,255,.1); color:rgba(255,255,255,.6); border:2px solid rgba(255,255,255,.15); }
  #steps span.on { color:#1b1b1b; border-color:transparent; }
  #steps span.on.s0 { background:#6fe0c8; } #steps span.on.s1 { background:#b6e36a; } #steps span.on.s2 { background:#ff8a3d; } #steps span.on.s3 { background:#b8bec9; }
  #chip { display:inline-block; margin-top:8px; background:var(--accent); color:#1b1b1b; font-weight:800;
    border-radius:999px; padding:5px 14px; font-size:15px; letter-spacing:1px; }
  #sub { position:absolute; left:6%; right:6%; bottom:22%; text-align:center; font-weight:800;
    font-size:27px; line-height:1.28; text-shadow:0 2px 0 #000, 0 0 12px rgba(0,0,0,.85); }
  #big { position:absolute; left:5%; right:5%; top:10%; text-align:center; }
  #big .l1 { font-size:26px; font-weight:800; color:var(--accent); letter-spacing:1px; }
  #big .l2 { font-size:50px; font-weight:900; line-height:1.06; margin-top:6px; text-shadow:0 4px 18px rgba(0,0,0,.7); }
  #big .l2 em { font-style:normal; color:var(--hot); }
  .label { position:absolute; transform:translate(-50%,-50%); background:rgba(6,9,20,.9);
    border:2px solid var(--accent); color:var(--ink); border-radius:8px; padding:4px 11px;
    font-weight:800; font-size:17px; white-space:nowrap; pointer-events:none; }
  .label.cold { border-color:var(--cold); } .label.hot { border-color:var(--hot); } .label.green { border-color:#4ee28a; } .label.red { border-color:#ff5a5a; } .label.gray { border-color:#b8bec9; }
  .label.big { font-size:21px; padding:6px 14px; }
  #bar { position:absolute; left:0; bottom:0; height:6px; background:linear-gradient(90deg,#6fe0c8,#ff8a3d); width:0; }
  #replay { position:absolute; top:12px; right:12px; background:var(--accent); border:0; color:#1b1b1b;
    font-weight:700; border-radius:8px; padding:8px 12px; cursor:pointer; font-size:14px; }
  body.capture #replay { display:none; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="topshade"></div>
<div id="shade"></div>
<div id="head"><div class="t">HOW A PISTON ENGINE WORKS</div>
  <div id="steps"><span class="s0">1 INTAKE</span><span class="s1">2 COMPRESSION</span><span class="s2">3 POWER</span><span class="s3">4 EXHAUST</span></div>
  <div id="chip"></div></div>
<div id="big"><div class="l1" id="big1"></div><div class="l2" id="big2"></div></div>
<div id="labels"></div>
<div id="sub"></div>
<div id="bar"></div>
<button id="replay">↻ Replay</button>
<script src="three.min.js"></script>
<script>
const TIMING = {
 "lines": [
  {
   "m": "hook",
   "text": "Every time a car moves, thousands of tiny explosions are happening under the hood. Here's how a piston turns them into motion.",
   "start": 0.5,
   "end": 7.82
  },
  {
   "m": "parts",
   "text": "Inside the engine is a cylinder. A piston slides up and down inside it, linked by a rod to a crankshaft.",
   "start": 9.02,
   "end": 15.57
  },
  {
   "m": "parts",
   "text": "At the top are two valves, one to let air and fuel in, one to let exhaust out, and a spark plug.",
   "start": 15.87,
   "end": 21.61
  },
  {
   "m": "intake",
   "text": "Stroke one: intake. The piston moves down, the intake valve opens, and a mix of air and fuel is sucked in.",
   "start": 22.81,
   "end": 29.65
  },
  {
   "m": "compress",
   "text": "Stroke two: compression. Both valves close, and the piston squeezes the mixture into a tiny space.",
   "start": 30.85,
   "end": 36.66
  },
  {
   "m": "power",
   "text": "Stroke three: power. The spark plug fires! The mixture explodes and slams the piston down with huge force.",
   "start": 37.86,
   "end": 44.58
  },
  {
   "m": "exhaust",
   "text": "Stroke four: exhaust. The exhaust valve opens, and the piston pushes the burnt gas out.",
   "start": 45.78,
   "end": 51.32
  },
  {
   "m": "cycle",
   "text": "Intake, compression, power, exhaust. Then it repeats, over and over.",
   "start": 52.52,
   "end": 56.62
  },
  {
   "m": "crank",
   "text": "The crankshaft is the clever part. It turns the piston's up and down motion into spinning, just like your legs pedalling a bicycle.",
   "start": 57.82,
   "end": 65.2
  },
  {
   "m": "multi",
   "text": "Real engines have four, six, or even eight pistons, firing one after another, so the power flows smoothly.",
   "start": 66.4,
   "end": 72.8
  },
  {
   "m": "rpm",
   "text": "At highway speed, each piston completes this whole cycle about twenty five times every second!",
   "start": 74.0,
   "end": 79.57
  },
  {
   "m": "outro",
   "text": "Tiny explosions, perfectly timed. That's what moves your car! Follow for more science made simple.",
   "start": 80.77,
   "end": 86.49
  }
 ],
 "duration": 88.29
};
(function(){
const LINES=TIMING.lines, DURATION=TIMING.duration, L=i=>LINES[i];
const W=()=>window.innerWidth, H=()=>window.innerHeight;
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const smooth=(a,b,x)=>{const k=clamp((x-a)/(b-a),0,1);return k*k*(3-2*k);};
const lerp=(a,b,k)=>a+(b-a)*k;
const win=(a,b,t,f=0.4)=>smooth(a,a+f,t)*(1-smooth(b-f,b,t));
const V=(x,y,z)=>new THREE.Vector3(x,y,z), TAU=Math.PI*2;
let seed=41; const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};

const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2)); renderer.outputEncoding=THREE.sRGBEncoding;
document.getElementById('stage').appendChild(renderer.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x0d1424);
const camera=new THREE.PerspectiveCamera(62,1,0.1,400);
scene.add(new THREE.HemisphereLight(0xe2ebff,0x1a2030,0.6)); scene.fog=new THREE.Fog(0x0d1424,22,60);
const keyL=new THREE.DirectionalLight(0xffffff,1.0); keyL.position.set(-6,12,10); scene.add(keyL);
const rimL=new THREE.DirectionalLight(0x7fb0ff,0.5); rimL.position.set(8,4,-8); scene.add(rimL);
const floor=new THREE.Mesh(new THREE.CircleGeometry(80,64),new THREE.MeshStandardMaterial({color:0x0c1220,roughness:0.9,metalness:0.1})); floor.rotation.x=-Math.PI/2; floor.position.y=-2.4; scene.add(floor);

function glowTex(){ const c=document.createElement('canvas'); c.width=c.height=128; const g=c.getContext('2d');
  const r=g.createRadialGradient(64,64,0,64,64,64); r.addColorStop(0,'rgba(255,255,255,1)'); r.addColorStop(0.3,'rgba(255,255,255,.5)'); r.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=r; g.fillRect(0,0,128,128); return new THREE.CanvasTexture(c); }
const GLOW=glowTex();
function sprite(color,size,op=1,add=true,parent=scene){ const s=new THREE.Sprite(new THREE.SpriteMaterial({map:GLOW,color,transparent:true,opacity:op,blending:add?THREE.AdditiveBlending:THREE.NormalBlending,depthWrite:false}));
  s.scale.set(size,size,1); parent.add(s); return s; }
const phys=(c,o={})=>new THREE.MeshPhysicalMaterial(Object.assign({color:c,roughness:0.32,metalness:0.6,clearcoat:0.5,clearcoatRoughness:0.2},o));
function makeArrow(color,r=0.12){ const m=new THREE.MeshBasicMaterial({color,transparent:true,opacity:0,depthWrite:false});
  const g=new THREE.Group(); const body=new THREE.Mesh(new THREE.CylinderGeometry(r,r,1,16),m); g.add(body); const head=new THREE.Mesh(new THREE.ConeGeometry(r*2.8,r*6,20),m); g.add(head);
  g.set=(from,dir,len,op)=>{ const hl=r*6, bl=Math.max(len-hl,0.05); body.scale.y=bl; body.position.y=bl/2; head.position.y=bl+hl/2; g.position.copy(from); g.quaternion.setFromUnitVectors(V(0,1,0),dir.clone().normalize()); m.opacity=op; g.visible=op>0.01; };
  scene.add(g); return g; }

// ---------- engine unit ----------
const CR=1.0, ROD=3.2, DECK=5.3;
const pinY=th=>CR*Math.cos(th)+Math.sqrt(ROD*ROD-Math.pow(CR*Math.sin(th),2));
const FUEL=new THREE.Color(0x6fe0c8), WARM=new THREE.Color(0xb6e36a), FIRE1=new THREE.Color(0xfff1a0), FIRE2=new THREE.Color(0xff7a2b), FIRE3=new THREE.Color(0x8a1f10), SMOKE=new THREE.Color(0x8a8f99);
function makeUnit(origin,opts={}){
  const g=new THREE.Group(); g.position.copy(origin); scene.add(g);
  const fade=[];
  const linerB=phys(0xaab3c2,{side:THREE.DoubleSide,metalness:0.5}), linerF=phys(0xaab3c2,{side:THREE.DoubleSide,metalness:0.5,transparent:true,opacity:0.12,depthWrite:false});
  [[linerB,Math.PI/2],[linerF,-Math.PI/2]].forEach(([m,ts])=>{ const c=new THREE.Mesh(new THREE.CylinderGeometry(1.1,1.1,DECK-2.3,48,1,true,ts,Math.PI),m); c.position.y=(DECK+2.3)/2; g.add(c); });
  // block jacket (back half) for a solid look
  const jacket=new THREE.Mesh(new THREE.CylinderGeometry(1.45,1.45,DECK-2.3,48,1,true,Math.PI/2,Math.PI),phys(0x5b6576,{side:THREE.DoubleSide})); jacket.position.y=(DECK+2.3)/2; g.add(jacket);
  const headB=new THREE.Mesh(new THREE.BoxGeometry(3.0,1.1,1.5),phys(0x6d7789)); headB.position.set(0,DECK+0.55,-0.75); g.add(headB);
  const headFm=phys(0x6d7789,{transparent:true,opacity:0.12,depthWrite:false}); const headF=new THREE.Mesh(new THREE.BoxGeometry(3.0,1.1,1.5),headFm); headF.position.set(0,DECK+0.55,0.75); g.add(headF);
  // ports
  const portI=new THREE.CatmullRomCurve3([V(-0.48,DECK+0.15,0),V(-0.7,DECK+0.9,0),V(-1.6,DECK+1.5,0),V(-2.8,DECK+1.9,0)]);
  const portE=new THREE.CatmullRomCurve3([V(0.48,DECK+0.15,0),V(0.7,DECK+0.9,0),V(1.6,DECK+1.5,0),V(2.8,DECK+1.9,0)]);
  g.add(new THREE.Mesh(new THREE.TubeGeometry(portI,40,0.34,16,false),phys(0x4f9bd8,{transparent:true,opacity:0.35,depthWrite:false,metalness:0.3})));
  g.add(new THREE.Mesh(new THREE.TubeGeometry(portE,40,0.34,16,false),phys(0x8a5a3c,{transparent:true,opacity:0.35,depthWrite:false,metalness:0.3})));
  // valves
  function valve(x,color){ const v=new THREE.Group(); v.position.x=x; g.add(v);
    const d=new THREE.Mesh(new THREE.CylinderGeometry(0.33,0.22,0.09,32),phys(color)); d.position.y=DECK-0.045; v.add(d);
    const st=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,1.6,12),phys(0xd8dee8)); st.position.y=DECK+0.75; v.add(st);
    const sp=new THREE.Mesh(new THREE.TorusGeometry(0.16,0.035,8,20),phys(0xd8dee8)); for(let k=0;k<4;k++){ const s2=sp.clone(); s2.rotation.x=Math.PI/2; s2.position.y=DECK+1.15+k*0.12; v.add(s2); }
    return v; }
  const vI=valve(-0.48,0x4fb0ff), vE=valve(0.48,0xff8a5a);
  // spark plug
  const plug=new THREE.Group(); g.add(plug);
  { const cer=new THREE.Mesh(new THREE.CylinderGeometry(0.13,0.16,0.9,20),phys(0xf3f3ee,{metalness:0.05,roughness:0.3})); cer.position.y=DECK+1.25; plug.add(cer);
    const hex=new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.22,0.22,6),phys(0xc0c6d0)); hex.position.y=DECK+0.72; plug.add(hex);
    const tip=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,0.6,10),phys(0xc0c6d0)); tip.position.y=DECK+0.3; plug.add(tip);
    const cap=new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08,0.25,12),phys(0x2a2e36)); cap.position.y=DECK+1.8; plug.add(cap); }
  const spark=sprite(0xbfe6ff,1.4,0,true,g); spark.position.set(0,DECK-0.08,0);
  const sparkLight=new THREE.PointLight(0xffb347,0,6); sparkLight.position.set(0,DECK-0.4,0.6); g.add(sparkLight);
  // gas column
  const gasM=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0,depthWrite:false});
  const gas=new THREE.Mesh(new THREE.CylinderGeometry(1.06,1.06,1,40),gasM); g.add(gas);
  const fireGlow=sprite(0xff9a3d,3.4,0,true,g);
  // piston
  const piston=new THREE.Group(); g.add(piston);
  { const p=new THREE.Mesh(new THREE.CylinderGeometry(1.04,1.04,1.0,48),phys(0xd4dae3,{metalness:0.75})); piston.add(p);
    for(let k=0;k<3;k++){ const r=new THREE.Mesh(new THREE.TorusGeometry(1.045,0.03,8,48),phys(0x4a5160)); r.rotation.x=Math.PI/2; r.position.y=0.38-k*0.14; piston.add(r); }
    const pin=new THREE.Mesh(new THREE.CylinderGeometry(0.14,0.14,1.3,16),phys(0x9aa3b2)); pin.rotation.x=Math.PI/2; pin.position.y=-0.1; piston.add(pin); }
  const pistonTopGlow=new THREE.MeshBasicMaterial({color:0xff7a2b,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false});
  const topDisc=new THREE.Mesh(new THREE.CircleGeometry(1.0,40),pistonTopGlow); topDisc.rotation.x=-Math.PI/2; topDisc.position.y=0.51; piston.add(topDisc);
  // connecting rod
  const rodM=phys(0xb8c2d0,{metalness:0.8,emissive:0x4ee28a,emissiveIntensity:0});
  const rod=new THREE.Mesh(new THREE.BoxGeometry(0.3,1,0.32),rodM); g.add(rod);
  const rodEnd=new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.3,0.36,24),rodM); rodEnd.rotation.x=Math.PI/2; g.add(rodEnd);
  // crankshaft
  const crank=new THREE.Group(); g.add(crank);
  const crankM=phys(0x8a95a8,{metalness:0.85,emissive:0xffc94d,emissiveIntensity:0});
  { const sh=new THREE.Mesh(new THREE.CylinderGeometry(0.26,0.26,opts.shaftLen||3.4,24),crankM); sh.rotation.x=Math.PI/2; sh.position.z=opts.shaftZ||-0.5; crank.add(sh);
    [-0.34,0.34].forEach(z=>{ const web=new THREE.Mesh(new THREE.BoxGeometry(0.75,1.5,0.16),crankM); web.position.set(0,0.35,z); crank.add(web);
      const cw=new THREE.Mesh(new THREE.CylinderGeometry(0.95,0.95,0.16,32,1,false,Math.PI/2,Math.PI),crankM); cw.rotation.x=Math.PI/2; cw.position.set(0,-0.1,z); crank.add(cw); });
    const cpin=new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.2,0.68,20),crankM); cpin.rotation.x=Math.PI/2; cpin.position.y=CR; crank.add(cpin); }
  let fly=null;
  if(opts.flywheel){ fly=new THREE.Group(); fly.position.z=-1.9; g.add(fly);
    const fw=new THREE.Mesh(new THREE.CylinderGeometry(1.9,1.9,0.3,64),phys(0x4a5263)); fw.rotation.x=Math.PI/2; fly.add(fw);
    for(let k=0;k<6;k++){ const a=k*TAU/6; const h=new THREE.Mesh(new THREE.CylinderGeometry(0.26,0.26,0.32,20),phys(0x1d222c)); h.rotation.x=Math.PI/2; h.position.set(Math.cos(a)*1.15,Math.sin(a)*1.15,0); fly.add(h); }
    const mark=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.55,0.34),phys(0xffc94d,{emissive:0xffc94d,emissiveIntensity:0.4})); mark.position.y=1.55; fly.add(mark); }
  // intake / exhaust particles
  const inP=[], exP=[];
  if(opts.fx){ for(let i=0;i<34;i++){ inP.push(sprite(0x8ff0da,0.34,0,true,g)); inP[i].userData={ph:rnd(),ox:(rnd()-0.5)*0.3,oz:(rnd()-0.5)*0.3}; }
    for(let i=0;i<34;i++){ exP.push(sprite(0x9aa0aa,0.5,0,false,g)); exP[i].userData={ph:rnd(),ox:(rnd()-0.5)*0.3,oz:(rnd()-0.5)*0.3}; } }
  const tmpC=new THREE.Color();
  function update(th,t){
    const ph=((th%(2*TAU))+2*TAU)%(2*TAU), stroke=Math.floor(ph/Math.PI)%4, w=(ph%Math.PI)/Math.PI;
    const py=pinY(th); piston.position.y=py+0.1;
    const cp=V(CR*Math.sin(th),CR*Math.cos(th),0), pp=V(0,py,0);
    crank.rotation.z=-th; if(fly) fly.rotation.z=-th;
    const d=pp.clone().sub(cp); rod.scale.y=d.length(); rod.position.copy(cp).addScaledVector(d,0.5); rod.quaternion.setFromUnitVectors(V(0,1,0),d.normalize()); rodEnd.position.copy(cp);
    const li=stroke===0?Math.sin(w*Math.PI):0, le=stroke===3?Math.sin(w*Math.PI):0;
    vI.position.y=-0.38*li; vE.position.y=-0.38*le;
    // gas in the chamber
    const top=py+0.6; gas.scale.y=Math.max(DECK-top,0.01); gas.position.y=(DECK+top)/2;
    let col=tmpC, op=0, fire=0;
    if(stroke===0){ col.copy(FUEL); op=0.12+0.3*w; }
    else if(stroke===1){ col.copy(FUEL).lerp(WARM,w); op=0.42+0.35*w; }
    else if(stroke===2){ col.copy(FIRE1).lerp(FIRE2,clamp(w*1.6,0,1)).lerp(FIRE3,clamp(w*1.6-0.6,0,1)); op=0.95-0.4*w; fire=Math.max(0,1-w*1.3); }
    else { col.copy(SMOKE); op=0.5*(1-w); }
    gasM.color.copy(col); gasM.opacity=op;
    fireGlow.position.set(0,(DECK+top)/2,0.4); fireGlow.material.opacity=0.9*fire; fireGlow.scale.setScalar(2.4+2*fire);
    pistonTopGlow.opacity=0.8*fire;
    const sp=(ph>2*Math.PI-0.06 && ph<2*Math.PI+0.45)?1-Math.abs(ph-2*Math.PI-0.1)/0.4:0;
    spark.material.opacity=clamp(sp,0,1); spark.scale.setScalar(0.8+1.2*clamp(sp,0,1)); sparkLight.intensity=3*fire+2*clamp(sp,0,1);
    if(opts.fx){ inP.forEach(s=>{ const dd=s.userData; if(stroke!==0){ s.material.opacity=0; return; } const k=(w*1.6+dd.ph)%1;
        if(k<0.6){ const p=portI.getPointAt(1-k/0.6); s.position.set(p.x+dd.ox,p.y+dd.ox,p.z+dd.oz); } else { const kk=(k-0.6)/0.4; s.position.set(-0.48+dd.ox*3+kk*0.6*dd.oz*4,lerp(DECK-0.1,top+0.2,kk),dd.oz*3); }
        s.material.opacity=0.85*Math.sin(Math.PI*w); });
      exP.forEach(s=>{ const dd=s.userData; if(stroke!==3){ s.material.opacity=0; return; } const k=(w*1.6+dd.ph)%1; const p=portE.getPointAt(k); s.position.set(p.x+dd.ox,p.y+dd.ox,p.z+dd.oz);
        s.scale.setScalar(0.4+k*0.6); s.material.opacity=0.6*Math.sin(Math.PI*w)*(1-k*0.5); }); }
    return {stroke,w,ph,top,py};
  }
  return {g,update,rodM,crankM,piston,crank,vI,vE};
}

const A=V(0,0,0);
const unitA=makeUnit(A,{flywheel:true,fx:true,shaftLen:3.6,shaftZ:-0.9});
// 4-cylinder engine (firing order 1-3-4-2)
const B=V(40,0,0), SP=2.9;
const OFFS=[2*Math.PI,3*Math.PI,Math.PI,0]; // crank-angle offsets for cylinders 1..4
const unitsB=OFFS.map((o,i)=>makeUnit(B.clone().add(V(0,0,-i*SP)),{shaftLen:SP,shaftZ:0}));
const blockB=new THREE.Mesh(new THREE.BoxGeometry(3.4,1.0,4*SP+0.6),phys(0x3e4656)); blockB.position.copy(B).add(V(0,-1.9,-1.5*SP)); scene.add(blockB);
const flyB=new THREE.Mesh(new THREE.CylinderGeometry(1.9,1.9,0.3,64),phys(0x4a5263)); flyB.rotation.x=Math.PI/2; flyB.position.copy(B).add(V(0,0,-3*SP-1.6)); scene.add(flyB);
const flyMark=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.55,0.34),phys(0xffc94d,{emissive:0xffc94d,emissiveIntensity:0.4})); scene.add(flyMark);

// arrows
const arPower=makeArrow(0xff5a3a,0.18), arUpDown=makeArrow(0x4ee28a,0.12), arUpDown2=makeArrow(0x4ee28a,0.12);
const spinArc=new THREE.Mesh(new THREE.TorusGeometry(2.3,0.06,10,60,Math.PI*1.4),new THREE.MeshBasicMaterial({color:0xffc94d,transparent:true,opacity:0})); spinArc.position.set(0,0,0.9); spinArc.rotation.z=Math.PI*0.2; scene.add(spinArc);
const spinHead=new THREE.Mesh(new THREE.ConeGeometry(0.22,0.5,16),spinArc.material); scene.add(spinHead);
{ const e=Math.PI*0.2; spinHead.position.set(Math.cos(e)*2.3,Math.sin(e)*2.3,0.9); spinHead.rotation.z=e+Math.PI; }

// ---------- timeline ----------
function integ(t0,t,f,dt=1/120){ let a=0; for(let x=t0+dt/2;x<t;x+=dt) a+=f(x)*dt; return a; }
const hookW=t=>5*(1-smooth(L(0).end-1.0,L(1).start-0.2,t));
function thetaA(t){
  if(t<L(1).start) return integ(0,t,hookW)-integ(0,L(1).start,hookW);
  if(t<L(7).start){ let th=0; for(let k=3;k<=6;k++) th+=Math.PI*smooth(L(k).start+0.2,L(k).end,t); return th; }
  return 4*Math.PI+integ(L(7).start,t,x=>3.2*(1-smooth(L(8).start-0.6,L(8).start+0.4,x))+1.5*smooth(L(8).start-0.6,L(8).start+0.4,x));
}
const wB=t=>4.5+9*win(L(10).start,L(10).end+0.4,t,0.8);
const thetaB=t=>integ(L(9).start-3,t,wB);

// ---------- labels ----------
const labelsEl=document.getElementById('labels'), LBL=[];
function label(text,cls,p,from,to){ const d=document.createElement('div'); d.className='label '+cls; d.textContent=text; labelsEl.appendChild(d); LBL.push({d,p:(typeof p==='function')?p:()=>p,from,to}); }
let stA={top:4.8,py:4.2};
const l1=L(1), d1=l1.end-l1.start, l2=L(2), d2=l2.end-l2.start;
label("Cylinder","",V(-1.9,3.6,0),l1.start+0.25*d1,l1.end+0.2);
label("Piston","cold",()=>V(1.9,stA.py+0.1,0.6),l1.start+0.38*d1,l1.end+0.2);
label("Connecting rod","green",V(1.7,1.7,0.6),l1.start+0.62*d1,l1.end+0.2);
label("Crankshaft","",V(-1.6,-0.6,0.8),l1.start+0.8*d1,l1.end+0.2);
label("Intake valve","cold",V(-2.4,DECK+0.3,0.5),l2.start+0.25*d2,l2.end+0.2);
label("Exhaust valve","gray",V(2.4,DECK+0.3,0.5),l2.start+0.5*d2,l2.end+0.2);
label("Spark plug","hot",V(0,DECK+2.4,0),l2.start+0.82*d2,l2.end+0.2);
label("Air + fuel in","cold",V(-2.9,DECK+2.4,0),L(3).start+2.4,L(3).end+0.2);
label("Squeezed ~10x smaller!","green",()=>V(0,stA.top+0.9,1.4),L(4).start+2.4,L(4).end+0.2);
label("SPARK!","hot big",V(1.4,DECK+0.9,0.8),L(5).start+0.5,L(5).start+2.6);
label("BANG! Huge force","red big",()=>V(1.9,stA.py-0.4,0.8),L(5).start+2.6,L(5).end+0.2);
label("Burnt gas out","gray",V(2.9,DECK+2.4,0),L(6).start+2.2,L(6).end+0.2);
label("Up & down","green",V(1.9,3.4,0.8),L(8).start+2.2,L(8).end+0.2);
label("→ Spinning!","",V(-2.6,2.0,1.0),L(8).start+3.6,L(8).end+0.2);
const cylNums=[1,2,3,4].map(n=>{ const p=B.clone().add(V(0,DECK+1.2,-(n-1)*SP)); return p; });
cylNums.forEach((p,i)=>label(String(i+1),"big",p,L(9).start+0.4+i*0.25,L(9).start+3.0));
label("Firing order: 1 - 3 - 4 - 2","hot big",B.clone().add(V(0,DECK+4.6,-4.4)),L(9).start+2.6,L(9).end+0.3);
label("~25 cycles every second!","hot big",B.clone().add(V(1.5,DECK+3.6,-4.2)),L(10).start+2.6,L(10).end+0.4);

// ---------- camera ----------
const SHOTS=[
  [0, [6.0,4.4,13.6], [0,1.9,0]],
  [L(1).start, [4.8,2.8,12.4], [0,1.7,0]],
  [L(2).start, [3.0,6.0,8.8], [0,4.6,0]],
  [L(3).start, [4.2,3.6,11.8], [0,2.3,0]],
  [L(5).start, [3.4,4.0,10.4], [0,2.7,0]],
  [L(6).start, [4.6,4.0,11.8], [0.3,2.7,0]],
  [L(8).start, [3.0,1.0,9.4], [0,0.2,0]],
  [L(9).start,   [B.x+8.5,6.5,7.5], [B.x,2.6,-4.4]],
  [L(10).start,  [B.x+6.0,7.0,4.0], [B.x,3.0,-4.4]],
  [L(11).start,  [B.x+9.5,5.0,8.5], [B.x,2.2,-4.4]],
];
function camAt(t){
  let i=0; while(i<SHOTS.length-1 && t>=SHOTS[i+1][0]) i++;
  const P=SHOTS[i], N=SHOTS[Math.min(i+1,SHOTS.length-1)];
  const k=(N===P)?0:smooth(N[0]-1.5,N[0]+0.1,t);
  const p=P[1].map((x,j)=>lerp(x,N[1][j],k)), g=P[2].map((x,j)=>lerp(x,N[2][j],k));
  camera.position.set(p[0]+Math.sin(t*0.3)*0.6,p[1]+Math.sin(t*0.2)*0.2,p[2]); camera.lookAt(g[0],g[1]-0.7,g[2]);
}
const CHIPS={hook:"",parts:"THE PARTS",intake:"",compress:"",power:"",exhaust:"",cycle:"THE 4-STROKE CYCLE",crank:"THE CRANKSHAFT",multi:"MORE CYLINDERS",rpm:"HOW FAST?",outro:""};
const sub=document.getElementById('sub'), chip=document.getElementById('chip'), head=document.getElementById('head'), stepsEl=document.getElementById('steps');
const stepEls=[...document.querySelectorAll('#steps span')];
const big=document.getElementById('big'), big1=document.getElementById('big1'), big2=document.getElementById('big2');
const tmp=V(0,0,0); let lastLine=-2;

function renderAt(t){
  t=clamp(t,0,DURATION); camAt(t);
  const thA=thetaA(t); stA=unitA.update(thA,t);
  const thB=thetaB(t); unitsB.forEach((u,i)=>u.update(thB+OFFS[i],t)); flyB.rotation.z=0; flyMark.position.copy(B).add(V(Math.sin(thB)*1.55,Math.cos(thB)*1.55,-3*SP-1.4)); flyMark.rotation.z=-thB;
  // highlights
  unitA.rodM.emissiveIntensity=0.5*win(L(1).start+0.6*(L(1).end-L(1).start),L(1).end,t);
  unitA.crankM.emissiveIntensity=0.45*Math.max(win(L(1).start+0.78*(L(1).end-L(1).start),L(1).end+0.2,t),win(L(8).start+0.5,L(8).end,t));
  const pw=win(L(5).start+2.2,L(5).end,t);
  arPower.set(V(0,stA.py+0.05,1.25),V(0,-1,0),1.8,pw);
  const ud=win(L(8).start+2.0,L(8).end,t);
  arUpDown.set(V(1.7,3.6,0.9),V(0,1,0),1.3,ud); arUpDown2.set(V(1.7,3.4,0.9),V(0,-1,0),1.3,ud);
  const sa=win(L(8).start+3.4,L(8).end,t); spinArc.material.opacity=sa;
  // overlay
  let li=-1; LINES.forEach((l,i)=>{ if(t>=l.start-0.05) li=i; });
  const line=li>=0?LINES[li]:null;
  if(li!==lastLine){ sub.textContent=line?line.text:''; const cc=line&&CHIPS[line.m]; chip.textContent=cc||''; chip.style.display=cc?'inline-block':'none'; lastLine=li; }
  const stepsOn=t>=L(3).start-0.3 && t<L(8).start; stepsEl.style.display=stepsOn?'flex':'none';
  stepEls.forEach((e,i)=>e.classList.toggle('on',stepsOn && i===stA.stroke));
  sub.style.opacity=(line && t<=line.end+0.3 && line.m!=='outro')?1:0;
  head.style.opacity=smooth(L(1).start-0.6,L(1).start,t)*(1-smooth(L(11).start-0.4,L(11).start,t));
  const intro=1-smooth(L(1).start-0.8,L(1).start-0.2,t), outro=smooth(L(11).start-0.2,L(11).start+0.4,t);
  if(outro>0){ big1.textContent="TINY EXPLOSIONS,"; big2.innerHTML="PERFECTLY <em>TIMED</em>"; big.style.opacity=outro; }
  else { big1.textContent="WHAT'S INSIDE YOUR CAR?"; big2.innerHTML="HOW A <em>PISTON</em><br>WORKS"; big.style.opacity=intro; }
  document.getElementById('bar').style.width=(t/DURATION*100)+'%';

  renderer.render(scene,camera);
  const cw=W(), ch=H();
  LBL.forEach(l=>{ const o=win(l.from,l.to,t,0.3); if(o<0.01){ l.d.style.display='none'; return; }
    tmp.copy(l.p()).project(camera); l.d.style.display=tmp.z<1?'block':'none'; l.d.style.opacity=o;
    const hw=l.d.offsetWidth/2+8; l.d.style.left=clamp((tmp.x+1)/2*cw,hw,cw-hw)+'px'; l.d.style.top=clamp((1-tmp.y)/2*ch,ch*0.22,ch*0.66)+'px'; });
}
window.renderAt=renderAt; window.DURATION=DURATION;
function resize(){ renderer.setSize(W(),H()); camera.aspect=W()/H(); camera.fov=camera.aspect<1?62:45; camera.updateProjectionMatrix(); }
window.addEventListener('resize',resize); resize();
if(location.hash==='#capture'){ document.body.classList.add('capture'); renderAt(0); }
else { let start=performance.now(); document.getElementById('replay').onclick=()=>{start=performance.now();};
  (function loop(){ renderAt(Math.min((performance.now()-start)/1000,DURATION)); requestAnimationFrame(loop); })(); }
})();
</script>
