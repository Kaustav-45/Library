<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hydraulic Lift Explained</title>
<style>
  :root { --bg:#0e1a2b; --ink:#f4f7fb; --accent:#ffc94d; }
  html,body { margin:0; height:100%; background:var(--bg); overflow:hidden;
    font-family:"Segoe UI", Roboto, Helvetica, Arial, sans-serif; color:var(--ink); }
  #stage { position:fixed; inset:0; } canvas { display:block; }
  #shade { position:absolute; left:0; right:0; bottom:0; height:44%; pointer-events:none;
    background:linear-gradient(to top, rgba(8,13,24,.3) 0%, rgba(8,13,24,.9) 30%, rgba(8,13,24,.55) 62%, rgba(8,13,24,0) 100%); }
  #topshade { position:absolute; left:0; right:0; top:0; height:19%; pointer-events:none;
    background:linear-gradient(to bottom, rgba(8,13,24,.85), rgba(8,13,24,0)); }
  #head { position:absolute; top:5.2%; left:0; right:0; text-align:center; }
  #head .t { font-size:30px; font-weight:900; letter-spacing:1px; text-shadow:0 3px 14px rgba(0,0,0,.7); }
  #head .chip { display:inline-block; margin-top:8px; background:var(--accent); color:#1b1b1b; font-weight:800;
    border-radius:999px; padding:5px 14px; font-size:15px; letter-spacing:1px; }
  #sub { position:absolute; left:6%; right:6%; bottom:22%; text-align:center; font-weight:800;
    font-size:27px; line-height:1.28; text-shadow:0 2px 0 #000, 0 0 12px rgba(0,0,0,.85); }
  #big { position:absolute; left:5%; right:5%; top:11%; text-align:center; }
  #big .l1 { font-size:26px; font-weight:800; color:var(--accent); letter-spacing:1px; }
  #big .l2 { font-size:54px; font-weight:900; line-height:1.05; margin-top:6px; text-shadow:0 4px 18px rgba(0,0,0,.7); }
  #uses { position:absolute; left:0; right:0; top:15%; display:flex; flex-wrap:wrap; gap:10px; justify-content:center; padding:0 6%; }
  #uses span { background:rgba(10,16,36,.9); border:2px solid var(--accent); border-radius:10px; padding:7px 14px;
    font-weight:800; font-size:19px; opacity:0; }
  .label { position:absolute; transform:translate(-50%,-50%); background:rgba(10,16,36,.9);
    border:2px solid var(--accent); color:var(--ink); border-radius:8px; padding:4px 11px;
    font-weight:800; font-size:17px; white-space:nowrap; pointer-events:none; }
  .label.green { border-color:#4ee28a; } .label.orange { border-color:#ff9b3d; } .label.red { border-color:#ff5a5a; }
  #bar { position:absolute; left:0; bottom:0; height:6px; background:var(--accent); width:0; }
  #replay { position:absolute; top:12px; right:12px; background:var(--accent); border:0; color:#1b1b1b;
    font-weight:700; border-radius:8px; padding:8px 12px; cursor:pointer; font-size:14px; }
  body.capture #replay { display:none; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="topshade"></div>
<div id="shade"></div>
<div id="head"><div class="t">HYDRAULIC LIFT</div><div class="chip" id="chip"></div></div>
<div id="big"><div class="l1" id="big1"></div><div class="l2" id="big2"></div></div>
<div id="uses"><span>Car lifts</span><span>Brakes</span><span>Excavators</span><span>Dentist chairs</span></div>
<div id="labels"></div>
<div id="sub"></div>
<div id="bar"></div>
<button id="replay">↻ Replay</button>
<script src="three.min.js"></script>
<script>
const TIMING = {
 "lines": [
  {
   "m": "hook",
   "text": "How can one small push lift a heavy car? Let's look inside a hydraulic lift.",
   "start": 0.5,
   "end": 5.04
  },
  {
   "m": "parts",
   "text": "It has two pistons. A small one here, and a big one here.",
   "start": 6.24,
   "end": 9.36
  },
  {
   "m": "parts",
   "text": "They're joined by a pipe, filled with oil.",
   "start": 9.66,
   "end": 11.83
  },
  {
   "m": "secret",
   "text": "Here's the secret: oil can't be squeezed into a smaller space.",
   "start": 13.03,
   "end": 16.53
  },
  {
   "m": "secret",
   "text": "So when you push the small piston down, the oil has to go somewhere.",
   "start": 16.83,
   "end": 20.5
  },
  {
   "m": "secret",
   "text": "The pressure spreads equally through all the oil, pushing on every surface with the same strength.",
   "start": 20.8,
   "end": 25.82
  },
  {
   "m": "force",
   "text": "The big piston has ten times more area, so it gets pushed up with ten times more force.",
   "start": 27.02,
   "end": 31.88
  },
  {
   "m": "force",
   "text": "Push with ten kilograms, and it lifts one hundred kilograms!",
   "start": 32.18,
   "end": 35.44
  },
  {
   "m": "catch",
   "text": "But there's a catch. Push the small piston down ten centimetres, and the big one rises only one centimetre.",
   "start": 36.64,
   "end": 42.68
  },
  {
   "m": "catch",
   "text": "The same amount of oil just spreads out wider. You trade distance for force.",
   "start": 42.98,
   "end": 47.16
  },
  {
   "m": "pump",
   "text": "That's why real lifts pump again and again. A one way valve stops the oil from flowing back.",
   "start": 48.36,
   "end": 53.55
  },
  {
   "m": "uses",
   "text": "Hydraulics power car lifts, brakes, excavators, and even dentist chairs.",
   "start": 54.75,
   "end": 59.16
  },
  {
   "m": "outro",
   "text": "One small push, one huge lift. That's hydraulics!",
   "start": 60.36,
   "end": 63.48
  }
 ],
 "duration": 65.28
};
(function(){
const LINES=TIMING.lines, DURATION=TIMING.duration, L=i=>LINES[i];
const W=()=>window.innerWidth, H=()=>window.innerHeight;
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const smooth=(a,b,x)=>{const k=clamp((x-a)/(b-a),0,1);return k*k*(3-2*k);};
const lerp=(a,b,k)=>a+(b-a)*k;
const win=(a,b,t,f=0.4)=>smooth(a,a+f,t)*(1-smooth(b-f,b,t));
const V=(x,y,z)=>new THREE.Vector3(x,y,z), UP=V(0,1,0);

const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2)); renderer.outputEncoding=THREE.sRGBEncoding;
document.getElementById('stage').appendChild(renderer.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x0e1a2b); scene.fog=new THREE.Fog(0x0e1a2b,30,70);
const camera=new THREE.PerspectiveCamera(62,1,0.1,200);
scene.add(new THREE.HemisphereLight(0xdde9ff,0x1c2638,0.95));
const sun=new THREE.DirectionalLight(0xffffff,0.85); sun.position.set(6,14,12); scene.add(sun);
const rim=new THREE.DirectionalLight(0x9ab8ff,0.35); rim.position.set(-10,5,-8); scene.add(rim);
const floor=new THREE.Mesh(new THREE.CircleGeometry(60,64),new THREE.MeshStandardMaterial({color:0x1a2a40,roughness:1}));
floor.rotation.x=-Math.PI/2; scene.add(floor);

const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:0.5,metalness:0.2},o));
const box=(w,h,d,m)=>new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
const cyl=(r1,r2,h,m,seg=32)=>new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,seg),m);
const steel=M(0xc9d2dc,{metalness:0.65,roughness:0.3}), darkM=M(0x3a4558,{metalness:0.4});
function seg(mesh,x,y1,y2,z=0){ mesh.scale.y=Math.max(Math.abs(y2-y1),0.001); mesh.position.set(x,(y1+y2)/2,z); }
function makeArrow(color,r=0.1){
  const m=new THREE.MeshBasicMaterial({color,transparent:true,opacity:0});
  const g=new THREE.Group(); const body=cyl(r,r,1,m,12); g.add(body);
  const head=new THREE.Mesh(new THREE.ConeGeometry(r*2.8,r*6,16),m); g.add(head);
  g.set=(from,dir,len,op)=>{ const hl=r*6, bl=Math.max(len-hl,0.05); body.scale.y=bl; body.position.y=bl/2; head.position.y=bl+hl/2;
    g.position.copy(from); g.quaternion.setFromUnitVectors(UP,dir.clone().normalize()); m.opacity=op; g.visible=op>0.01; };
  scene.add(g); return g;
}

// ---------- model ----------
const SR=0.45, BR=1.42, SX=-2.3, BX=1.7, BOT=0.95;   // area ratio (BR/SR)^2 ≈ 10
const YS0=5.6, YB0=2.8, STROKE=2.0, RISE=STROKE*SR*SR/(BR*BR);
const glass=new THREE.MeshStandardMaterial({color:0xcfe8ff,transparent:true,opacity:0.2,roughness:0.1,side:THREE.DoubleSide,depthWrite:false});
const oil=new THREE.MeshStandardMaterial({color:0xd98a10,roughness:0.3,metalness:0.05,emissive:0xff9b1a,emissiveIntensity:0.04});
const base=box(8.6,0.55,2.8,darkM); base.position.set(-0.6,0.28,0); scene.add(base);
const smallTube=new THREE.Mesh(new THREE.CylinderGeometry(SR+0.06,SR+0.06,5.7,32,1,true),glass); smallTube.position.set(SX,BOT+2.85,0); scene.add(smallTube);
const bigTube=new THREE.Mesh(new THREE.CylinderGeometry(BR+0.06,BR+0.06,3.1,48,1,true),glass); bigTube.position.set(BX,BOT+1.55,0); scene.add(bigTube);
const pipeG=box(4.2,0.75,1.0,glass); pipeG.position.set(-0.3,BOT+0.1,0); scene.add(pipeG);
const pipeOil=box(4.1,0.66,0.9,oil); pipeOil.position.set(-0.3,BOT+0.1,0); scene.add(pipeOil);
const oilS=new THREE.Mesh(new THREE.CylinderGeometry(SR,SR,1,32),oil), oilB=new THREE.Mesh(new THREE.CylinderGeometry(BR,BR,1,48),oil);
scene.add(oilS,oilB);
const pistonMat=M(0xd6dce4,{metalness:0.7,roughness:0.3});
const pistonS=cyl(SR,SR,0.26,pistonMat), pistonB=cyl(BR,BR,0.3,pistonMat,48); scene.add(pistonS,pistonB);
const rodS=cyl(0.09,0.09,1,steel,12), rodB=cyl(0.32,0.32,1,steel,20); scene.add(rodS,rodB);
const knob=cyl(0.5,0.5,0.2,M(0xff7a3d)); scene.add(knob);
const platform=box(3.6,0.2,2.3,darkM); scene.add(platform);
const car=new THREE.Group(); scene.add(car);
{ const paint=M(0xe8443a,{metalness:0.4,roughness:0.35});
  const body=box(3.0,0.55,1.45,paint); body.position.y=0.55; car.add(body);
  const cab=box(1.55,0.52,1.3,paint); cab.position.set(-0.15,1.07,0); car.add(cab);
  const w=box(1.57,0.32,1.32,M(0x9fd4ff,{metalness:0.6,roughness:0.1})); w.position.set(-0.15,1.1,0); car.add(w);
  [[-1,0.72],[1,0.72],[-1,-0.72],[1,-0.72]].forEach(([x,z])=>{ const t=cyl(0.3,0.3,0.24,M(0x1b1b1b),20); t.rotation.x=Math.PI/2; t.position.set(x,0.3,z); car.add(t); }); }
// area highlight discs
const areaMatS=new THREE.MeshBasicMaterial({color:0x4ee28a,transparent:true,opacity:0,side:THREE.DoubleSide,depthWrite:false});
const areaMatB=new THREE.MeshBasicMaterial({color:0xffc94d,transparent:true,opacity:0,side:THREE.DoubleSide,depthWrite:false});
const areaS=new THREE.Mesh(new THREE.CircleGeometry(SR,32),areaMatS); areaS.rotation.x=-Math.PI/2; scene.add(areaS);
const areaB=new THREE.Mesh(new THREE.CircleGeometry(BR,48),areaMatB); areaB.rotation.x=-Math.PI/2; scene.add(areaB);
// "same amount of oil" ghost + slice
const ghostMat=new THREE.MeshBasicMaterial({color:0xff9b3d,transparent:true,opacity:0,depthWrite:false});
const ghostS=new THREE.Mesh(new THREE.CylinderGeometry(SR+0.02,SR+0.02,1,32),ghostMat); scene.add(ghostS);
const sliceB=new THREE.Mesh(new THREE.CylinderGeometry(BR+0.02,BR+0.02,1,48),ghostMat); scene.add(sliceB);
// distance brackets
function bracket(color){ const m=new THREE.MeshBasicMaterial({color,transparent:true,opacity:0});
  const g=new THREE.Group(); const v=cyl(0.04,0.04,1,m,8); const t1=box(0.4,0.06,0.06,m), t2=t1.clone(); g.add(v,t1,t2);
  g.set=(x,y1,y2,z,op)=>{ seg(v,x,y1,y2,z); t1.position.set(x,y1,z); t2.position.set(x,y2,z); m.opacity=op; g.visible=op>0.01; };
  scene.add(g); return g; }
const brS=bracket(0x4ee28a), brB=bracket(0xffc94d);
// reservoir + one-way valve
const RX=-4.4;
const tank=box(1.7,2.0,1.7,glass); tank.position.set(RX,BOT+1.0,0); scene.add(tank);
const tankOil=box(1.6,1,1.6,oil); scene.add(tankOil);
const feed=box(1.3,0.35,0.5,glass); feed.position.set(RX+1.1,BOT+0.25,0); scene.add(feed);
const feedOil=box(1.3,0.28,0.42,oil); feedOil.position.set(RX+1.1,BOT+0.25,0); scene.add(feedOil);
const valveMat=M(0x4ee28a,{emissive:0x4ee28a,emissiveIntensity:0.4});
const valve=new THREE.Group(); valve.position.set(0.4,BOT+0.45,0); scene.add(valve);
const flap=box(0.08,0.7,0.95,valveMat); flap.position.y=-0.35; valve.add(flap);
const hinge=cyl(0.07,0.07,1.0,darkM,10); hinge.rotation.x=Math.PI/2; valve.add(hinge);
// arrows
const aPush=makeArrow(0x4ee28a,0.12), aLift=makeArrow(0xffc94d,0.2);
const pArrows=[];
[[SX,2.4,0,-1,0,0],[SX,2.4,0,1,0,0],[SX,1.6,0,-1,0,0],[-1.4,BOT+0.1,0,0,1,0],[-0.6,BOT+0.1,0,0,-1,0],[0.8,BOT+0.1,0,0,1,0],
 [BX-1.0,2.0,0,-1,0,0],[BX+1.0,2.0,0,1,0,0],[BX,1.6,0.9,0,0,1],[BX-0.5,2.3,0,0,1,0],[BX+0.5,2.3,0,0,1,0]].forEach(c=>{ const a=makeArrow(0x1e5bff,0.08); a.cfg=c; pArrows.push(a); });

// ---------- labels ----------
const labelsEl=document.getElementById('labels'), LBL=[];
function label(text,cls,posFn,from,to){ const d=document.createElement('div'); d.className='label '+cls; d.textContent=text; labelsEl.appendChild(d); LBL.push({d,posFn,from,to}); }
let ys=YS0, yb=YB0;
label("Small piston","green",()=>V(SX-1.5,ys+0.3,0),L(1).start+0.4,L(1).end+0.2);
label("Big piston","",()=>V(BX+0.3,yb+0.75,BR+0.4),L(1).start+1.8,L(1).end+0.2);
label("Pipe full of oil","orange",()=>V(-0.3,BOT+1.2,1.0),L(2).start+0.3,L(2).end+0.6);
label("Oil can't be squeezed","orange",()=>V(-0.3,BOT+1.2,1.0),L(3).start+1.0,L(3).end+0.3);
label("Push","green",()=>V(SX-1.1,ys+3.3,0),L(4).start+0.5,L(4).end);
label("Same pressure everywhere","",()=>V(-0.3,BOT+1.2,1.0),L(5).start+0.6,L(5).end+0.3);
label("Area: 1x","green",()=>V(SX-1.4,ys+0.3,0),L(6).start+0.3,L(6).end+0.2);
label("Area: 10x","",()=>V(BX,yb+0.55,BR+0.5),L(6).start+1.3,L(6).end+0.2);
label("10 kg","green",()=>V(SX-1.2,ys+3.3,0),L(7).start+0.2,L(7).end+0.4);
label("100 kg","",()=>V(BX+1.6,yb+4.4,0),L(7).start+1.2,L(7).end+0.4);
label("Down 10 cm","green",()=>V(SX-1.55,(YS0+ys)/2,0),L(8).start+2.4,L(8).end+0.2);
label("Up 1 cm","",()=>V(BX+BR+1.15,yb-0.3,0),L(8).start+4.2,L(8).end+0.2);
label("Same amount of oil","orange",()=>V(-0.3,4.4,0),L(9).start+0.2,L(9).end+0.3);
label("Oil tank","orange",()=>V(RX,BOT+2.5,0),L(10).start+1.2,L(10).end+0.4);
label("One-way valve","green",()=>V(0.4,BOT+1.3,1.0),L(10).start+2.2,L(10).end+0.6);

// ---------- motion ----------
const P1a=L(4).start+0.4, P1b=L(5).end-0.6;          // first push
const PU0=L(10).start+0.2, PU1=L(10).end+1.0, CYC=2; // pumping
function pistons(t){
  let s=YS0-STROKE*smooth(P1a,P1b,t), b=YB0+RISE*smooth(P1a,P1b,t), tankDrop=0, valveOpen=smooth(P1a,P1a+0.3,t), refill=0;
  if(t>PU0){
    const u=clamp((t-PU0)/(PU1-PU0),0,0.9999)*CYC, c=Math.floor(u), f=u-c;
    if(t>=PU1){ s=YS0-STROKE; b=YB0+RISE*(1+CYC); tankDrop=CYC; valveOpen=1; }
    else if(f<0.5){ const k=smooth(0,0.5,f); s=YS0-STROKE+STROKE*k; b=YB0+RISE*(1+c); tankDrop=c+k; valveOpen=0; refill=1; }
    else { const k=smooth(0.5,1,f); s=YS0-STROKE*k; b=YB0+RISE*(1+c+k); tankDrop=c+1; valveOpen=1; }
  }
  return {s,b,tankDrop,valveOpen,refill};
}

// ---------- camera ----------
const SHOTS=[
  [0,          [3,8.5,16],  [-0.3,2.9,0]],
  [L(1).start, [1.5,6.8,12.5],[-0.3,2.1,0]],
  [L(4).start, [0.5,7.4,13.0],[-1.2,2.1,0]],
  [L(5).start, [2.5,6.0,12.0],[-0.4,1.3,0]],
  [L(6).start, [3.5,6.6,11.5],[0.2,1.9,0]],
  [L(8).start, [1.2,6.4,12.5],[-0.2,1.9,0]],
  [L(10).start,[-0.5,7.0,14.0],[-1.0,1.7,0]],
  [L(11).start,[6,7.5,15],  [-0.3,3.1,0]],
  [L(12).start,[3,8.5,16],  [-0.3,3.1,0]],
];
function camAt(t){
  let i=0; while(i<SHOTS.length-1 && t>=SHOTS[i+1][0]) i++;
  const A=SHOTS[i], B=SHOTS[Math.min(i+1,SHOTS.length-1)];
  const k=(B===A)?0:smooth(B[0]-1.4,B[0]+0.2,t);
  const p=A[1].map((x,j)=>lerp(x,B[1][j],k)), g=A[2].map((x,j)=>lerp(x,B[2][j],k));
  g[1]+=0.5; for(let j=0;j<3;j++) p[j]=g[j]+(p[j]-g[j])*1.12; // a touch wider, model centred above subtitles
  camera.position.set(p[0]+Math.sin(t*0.3)*0.7,p[1],p[2]); camera.lookAt(g[0],g[1],g[2]);
}

const CHIPS={hook:"",parts:"STEP 1 · THE PARTS",secret:"STEP 2 · THE SECRET",force:"STEP 3 · FORCE x10",catch:"STEP 4 · THE CATCH",pump:"STEP 5 · PUMPING",uses:"WHERE IT'S USED",outro:""};
const sub=document.getElementById('sub'), chip=document.getElementById('chip'), head=document.getElementById('head');
const big=document.getElementById('big'), big1=document.getElementById('big1'), big2=document.getElementById('big2');
const useEls=[...document.querySelectorAll('#uses span')];
const tmp=V(0,0,0); let lastLine=-2;

function renderAt(t){
  t=clamp(t,0,DURATION); camAt(t);
  const st=pistons(t); ys=st.s; yb=st.b;
  seg(oilS,SX,BOT,ys); seg(oilB,BX,BOT,yb);
  pistonS.position.set(SX,ys+0.13,0); pistonB.position.set(BX,yb+0.15,0);
  seg(rodS,SX,ys+0.25,ys+2.3); knob.position.set(SX,ys+2.4,0);
  seg(rodB,BX,yb+0.3,yb+2.0); platform.position.set(BX,yb+2.1,0); car.position.set(BX,yb+2.2,0);
  const lvl=1.75-0.45*st.tankDrop; seg(tankOil,RX,BOT+0.05,BOT+lvl); tankOil.position.x=RX;
  flap.parent.rotation.z=-1.1*st.valveOpen;
  valveMat.color.setHex(st.valveOpen>0.5?0x4ee28a:0xff5a5a); valveMat.emissive.setHex(st.valveOpen>0.5?0x4ee28a:0xff5a5a);
  valveMat.emissiveIntensity=0.15+0.5*win(L(10).start+2,L(10).end+0.6,t);

  // pressure
  const press=win(L(5).start,L(5).end+0.3,t);
  oil.emissiveIntensity=0.04+0.35*press*(0.6+0.4*Math.sin(t*8));
  pArrows.forEach((a,i)=>{ const c=a.cfg; a.set(V(c[0],c[1],c[2]),V(c[3],c[4],c[5]),0.75+0.12*Math.sin(t*6+i),press); });
  // push / lift arrows
  aPush.set(V(SX,ys+3.75,0),V(0,-1,0),1.2,win(L(4).start+0.3,L(7).end+0.4,t));
  aLift.set(V(BX,yb+3.85,0),V(0,1,0),1.0*(1+smooth(L(7).start+1,L(7).start+1.8,t)*0.6),win(L(6).start+1.2,L(7).end+0.4,t));
  // areas
  const aOp=win(L(6).start+0.2,L(6).end+0.2,t);
  areaMatS.opacity=0.85*aOp; areaS.position.set(SX,ys+0.28,0);
  areaMatB.opacity=0.75*smooth(L(6).start+1.2,L(6).start+1.6,t)*(1-smooth(L(6).end-0.2,L(6).end+0.2,t)); areaB.position.set(BX,yb+0.32,0);
  // catch: distances and same volume
  brS.set(SX-0.85,ys,YS0,0,win(L(8).start+2.2,L(8).end+0.2,t));
  brB.set(BX+BR+0.35,YB0,yb,0,win(L(8).start+4.0,L(8).end+0.2,t));
  const gOp=win(L(9).start,L(9).end+0.3,t)*(0.55+0.2*Math.sin(t*5));
  ghostMat.opacity=gOp; seg(ghostS,SX,ys+0.27,YS0+0.27); seg(sliceB,BX,YB0-0.01,yb+0.01);
  ghostS.visible=sliceB.visible=gOp>0.01;

  renderer.render(scene,camera);

  // overlay
  let li=-1; LINES.forEach((l,i)=>{ if(t>=l.start-0.05) li=i; });
  const line=li>=0?LINES[li]:null;
  if(li!==lastLine){ sub.textContent=line?line.text:''; chip.textContent=line?CHIPS[line.m]:''; chip.style.display=(line&&CHIPS[line.m])?'inline-block':'none'; lastLine=li; }
  sub.style.opacity=(line && t<=line.end+0.3 && line.m!=='outro')?1:0;
  head.style.opacity=smooth(L(1).start-0.6,L(1).start,t)*(1-smooth(L(12).start-0.4,L(12).start,t));
  const intro=1-smooth(L(1).start-0.8,L(1).start-0.2,t), outro=smooth(L(12).start-0.2,L(12).start+0.4,t);
  if(outro>0){ big1.textContent="ONE SMALL PUSH"; big2.textContent="ONE HUGE LIFT!"; big.style.opacity=outro; }
  else { big1.textContent="HOW DOES A"; big2.textContent="HYDRAULIC LIFT WORK?"; big.style.opacity=intro; }
  useEls.forEach((u,i)=>{ u.style.opacity=win(L(11).start+0.3+i*0.9,L(11).end+0.6,t,0.3); });
  document.getElementById('bar').style.width=(t/DURATION*100)+'%';
  const cw=W(), ch=H();
  LBL.forEach(l=>{ const o=win(l.from,l.to,t,0.3); if(o<0.01){ l.d.style.display='none'; return; }
    tmp.copy(l.posFn()).project(camera); l.d.style.display=tmp.z<1?'block':'none'; l.d.style.opacity=o;
    l.d.style.left=clamp((tmp.x+1)/2*cw,80,cw-80)+'px'; l.d.style.top=((1-tmp.y)/2*ch)+'px'; });
}
window.renderAt=renderAt; window.DURATION=DURATION;
function resize(){ renderer.setSize(W(),H()); camera.aspect=W()/H(); camera.fov=camera.aspect<1?62:45; camera.updateProjectionMatrix(); }
window.addEventListener('resize',resize); resize();
if(location.hash==='#capture'){ document.body.classList.add('capture'); renderAt(0); }
else { let start=performance.now(); document.getElementById('replay').onclick=()=>{start=performance.now();};
  (function loop(){ renderAt(Math.min((performance.now()-start)/1000,DURATION)); requestAnimationFrame(loop); })(); }
})();
</script>
</body>
</html>
