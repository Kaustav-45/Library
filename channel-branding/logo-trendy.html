<!doctype html>
<html><head><meta charset="utf-8"><title>How It Spins logo (trendy)</title>
<style>
  html,body{margin:0;width:1024px;height:1024px;overflow:hidden}
  body.gradient{background:
      radial-gradient(circle at 22% 18%, #ffb36b 0%, rgba(255,179,107,0) 42%),
      radial-gradient(circle at 85% 85%, #2fd3ff 0%, rgba(47,211,255,0) 45%),
      linear-gradient(135deg, #7a2cff 0%, #e92bb0 55%, #ff6a3d 100%);}
  body.neon{background:radial-gradient(circle at 50% 45%, #1a0b3d 0%, #0b0620 55%, #04020c 100%);}
  canvas{position:absolute;inset:0}
  body.neon canvas{filter:drop-shadow(0 0 22px rgba(255,60,220,.75)) drop-shadow(0 0 44px rgba(0,229,255,.45));}
  body.gradient canvas{filter:drop-shadow(0 30px 40px rgba(40,0,80,.45));}
  .ring{position:absolute;inset:70px;border-radius:50%;}
  body.neon .ring{border:6px solid rgba(0,229,255,.0);}
</style></head>
<body>
<script src="../turbine-explainer/three.min.js"></script>
<script>
const MODE=location.hash.slice(1)||'gradient'; document.body.className=MODE;
const S=1024;
const r=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
r.setSize(S,S); r.setClearColor(0,0); r.outputEncoding=THREE.sRGBEncoding; document.body.appendChild(r.domElement);
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(30,1,0.1,100); cam.position.set(0,0,24); cam.lookAt(0,0,0);

function gear(R,teeth,depth,hole,mat,spokes=5){
  const s=new THREE.Shape(), th=R*0.2, n=teeth*4;
  for(let i=0;i<=n;i++){ const a=i/n*Math.PI*2, ph=i%4, rr=(ph===1||ph===2)?R+th:R;
    const aa=a+(ph===1?0.035:ph===2?-0.035:0); const x=Math.cos(aa)*rr, y=Math.sin(aa)*rr; i?s.lineTo(x,y):s.moveTo(x,y); }
  const h=new THREE.Path(); h.absarc(0,0,hole,0,Math.PI*2,true); s.holes.push(h);
  for(let k=0;k<spokes;k++){ const a=k/spokes*Math.PI*2+0.3, p=new THREE.Path(); p.absarc(Math.cos(a)*R*0.6,Math.sin(a)*R*0.6,R*0.18,0,Math.PI*2,true); s.holes.push(p); }
  const g=new THREE.ExtrudeGeometry(s,{depth,bevelEnabled:true,bevelThickness:0.28,bevelSize:0.2,bevelSegments:8,curveSegments:32});
  g.center(); return new THREE.Mesh(g,mat);
}
const group=new THREE.Group(); scene.add(group);
let big, small, mats;

if(MODE==='gradient'){
  // glossy "clay" look lit by coloured lights
  scene.add(new THREE.HemisphereLight(0xffffff,0x6a2bd6,0.45));
  const key=new THREE.DirectionalLight(0xffffff,0.95); key.position.set(-6,8,10); scene.add(key);
  const pink=new THREE.DirectionalLight(0xff4fd8,1.1); pink.position.set(8,-4,5); scene.add(pink);
  const cyan=new THREE.DirectionalLight(0x3fe0ff,0.9); cyan.position.set(-8,-6,3); scene.add(cyan);
  const white=new THREE.MeshPhysicalMaterial({color:0xf3eefc,roughness:0.3,metalness:0.0,clearcoat:1,clearcoatRoughness:0.08});
  const yellow=new THREE.MeshPhysicalMaterial({color:0xffb800,roughness:0.3,metalness:0.0,clearcoat:1,clearcoatRoughness:0.1});
  big=gear(2.6,12,1.0,0.7,white); small=gear(1.25,8,0.9,0.35,yellow,4);
  const dot=new THREE.Mesh(new THREE.SphereGeometry(0.55,40,30),yellow); dot.scale.z=0.6; group.add(dot); dot.userData.follow='big';
  mats={arc:0xffffff};
} else {
  // neon: dark glossy gears with glowing outlines
  scene.add(new THREE.HemisphereLight(0x8a7dff,0x05020f,0.5));
  const m1=new THREE.DirectionalLight(0xff3cdc,1.6); m1.position.set(7,6,8); scene.add(m1);
  const c1=new THREE.DirectionalLight(0x00e5ff,1.6); c1.position.set(-8,-5,7); scene.add(c1);
  const dark=new THREE.MeshPhysicalMaterial({color:0x1b1340,roughness:0.25,metalness:0.6,clearcoat:1,clearcoatRoughness:0.1});
  big=gear(2.6,12,1.0,0.7,dark); small=gear(1.25,8,0.9,0.35,dark,4);
  // glowing edge outlines
  [[big,0xff3cdc],[small,0x00e5ff]].forEach(([g,c])=>{
    const e=new THREE.LineSegments(new THREE.EdgesGeometry(g.geometry,25),new THREE.LineBasicMaterial({color:c}));
    g.add(e); const e2=e.clone(); e2.scale.setScalar(1.004); g.add(e2); });
  const core=new THREE.Mesh(new THREE.SphereGeometry(0.5,32,24),new THREE.MeshBasicMaterial({color:0xfff27a})); core.userData.follow='big'; group.add(core);
  mats={arc:0x00e5ff};
}
big.position.set(-0.9,0.8,0); big.rotation.z=0.12;
small.position.set(2.05,-2.05,0.2); small.rotation.z=0.3;
group.add(big,small);
group.children.forEach(c=>{ if(c.userData.follow==='big') c.position.set(big.position.x,big.position.y,0.6); });

// motion streaks around the big gear
const arcs=[[3.55,0.11,1.0,Math.PI*0.5,Math.PI*1.0],[3.95,0.06,0.55,Math.PI*0.62,Math.PI*0.7],[4.3,0.035,0.3,Math.PI*0.72,Math.PI*0.45]];
arcs.forEach(([rad,tube,op,start,len],i)=>{
  const m=new THREE.MeshBasicMaterial({color:mats.arc,transparent:true,opacity:op});
  const a=new THREE.Mesh(new THREE.TorusGeometry(rad,tube,12,100,len),m); a.position.copy(big.position); a.rotation.z=start; group.add(a);
  if(i===0){ const end=start+len; const head=new THREE.Mesh(new THREE.ConeGeometry(0.34,0.75,24),m);
    head.position.set(big.position.x+Math.cos(end)*rad,big.position.y+Math.sin(end)*rad,0); head.rotation.z=end; group.add(head); }
});
// sparkles
const sp=new THREE.MeshBasicMaterial({color:MODE==='gradient'?0xffffff:0xfff27a});
[[3.3,3.1,0.16],[-3.9,-2.6,0.12],[3.8,0.9,0.09],[-1.2,-4.1,0.1]].forEach(([x,y,s])=>{
  const g=new THREE.Group(); [0,Math.PI/2].forEach(rz=>{ const b=new THREE.Mesh(new THREE.BoxGeometry(s*0.5,s*4,0.02),sp); b.rotation.z=rz+Math.PI/4*0; g.add(b); });
  g.position.set(x,y,0.5); g.rotation.z=Math.PI/4*(x>0?0:1); group.add(g); });
group.rotation.set(-0.22,0.3,0); group.position.set(-0.1,0.25,0);
r.render(scene,cam);
</script>
</body></html>
