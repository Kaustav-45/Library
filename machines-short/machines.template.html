<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3 Machines Explained</title>
<style>
  :root { --bg:#0d1430; --ink:#f4f7fb; --accent:#ffc94d; }
  html,body { margin:0; height:100%; background:var(--bg); overflow:hidden;
    font-family:"Segoe UI", Roboto, Helvetica, Arial, sans-serif; color:var(--ink); }
  #stage { position:fixed; inset:0; }
  canvas { display:block; }
  #shade { position:absolute; left:0; right:0; bottom:0; height:46%; pointer-events:none;
    background:linear-gradient(to top, rgba(8,12,28,.25) 0%, rgba(8,12,28,.88) 30%, rgba(8,12,28,.6) 60%, rgba(8,12,28,0) 100%); }
  #topshade { position:absolute; left:0; right:0; top:0; height:20%; pointer-events:none;
    background:linear-gradient(to bottom, rgba(8,12,28,.8), rgba(8,12,28,0)); }
  #badge { position:absolute; top:5.5%; left:0; right:0; text-align:center; }
  #badge .num { display:inline-block; background:var(--accent); color:#1b1b1b; font-weight:800;
    border-radius:999px; padding:5px 14px; font-size:15px; letter-spacing:1px; }
  #badge .name { font-size:34px; font-weight:900; margin-top:8px; letter-spacing:.5px;
    text-shadow:0 3px 14px rgba(0,0,0,.7); }
  #dots { display:flex; gap:8px; justify-content:center; margin-top:10px; }
  #dots span { width:34px; height:6px; border-radius:3px; background:rgba(255,255,255,.25); }
  #dots span.on { background:var(--accent); }
  #sub { position:absolute; left:6%; right:6%; bottom:22%; text-align:center; font-weight:800;
    font-size:27px; line-height:1.28; text-shadow:0 2px 0 #000, 0 0 12px rgba(0,0,0,.85); }
  #sub b { color:var(--accent); }
  #big { position:absolute; left:5%; right:5%; top:12%; text-align:center; }
  #big .l1 { font-size:30px; font-weight:800; color:var(--accent); letter-spacing:1px; }
  #big .l2 { font-size:56px; font-weight:900; line-height:1.05; margin-top:6px; text-shadow:0 4px 18px rgba(0,0,0,.7); }
  #big .l3 { font-size:24px; font-weight:700; margin-top:12px; opacity:.9; }
  .label { position:absolute; transform:translate(-50%,-50%); background:rgba(10,16,36,.88);
    border:2px solid var(--accent); color:var(--ink); border-radius:8px; padding:3px 10px;
    font-weight:800; font-size:16px; white-space:nowrap; pointer-events:none; }
  .label.red { border-color:#ff5a5a; } .label.green { border-color:#4ee28a; } .label.blue { border-color:#5aa9ff; }
  #bar { position:absolute; left:0; bottom:0; height:6px; background:var(--accent); width:0; }
  #replay { position:absolute; top:12px; right:12px; background:var(--accent); border:0; color:#1b1b1b;
    font-weight:700; border-radius:8px; padding:8px 12px; cursor:pointer; font-size:14px; }
  body.capture #replay { display:none; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="topshade"></div>
<div id="shade"></div>
<div id="badge"><div class="num" id="bnum"></div><div class="name" id="bname"></div><div id="dots"><span></span><span></span><span></span></div></div>
<div id="big"><div class="l1" id="big1"></div><div class="l2" id="big2"></div><div class="l3" id="big3"></div></div>
<div id="labels"></div>
<div id="sub"></div>
<div id="bar"></div>
<button id="replay">↻ Replay</button>
<script src="three.min.js"></script>
<script>
const TIMING = /*TIMING*/null;
(function(){
const LINES = TIMING.lines, DURATION = TIMING.duration;
const L = i => LINES[i];
const W = () => window.innerWidth, H = () => window.innerHeight;
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const smooth=(a,b,x)=>{const k=clamp((x-a)/(b-a),0,1);return k*k*(3-2*k);};
const lerp=(a,b,k)=>a+(b-a)*k;
const win=(a,b,t,f=0.4)=>smooth(a,a+f,t)*(1-smooth(b-f,b,t));
const firstOf=m=>LINES.find(l=>l.m===m), lastOf=m=>[...LINES].reverse().find(l=>l.m===m);

// ---------- renderer ----------
const renderer=new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.outputEncoding=THREE.sRGBEncoding;
document.getElementById('stage').appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0d1430);
scene.fog=new THREE.Fog(0x0d1430,40,90);
const camera=new THREE.PerspectiveCamera(62,1,0.1,300);
scene.add(new THREE.HemisphereLight(0xd8e8ff,0x202840,0.95));
const sun=new THREE.DirectionalLight(0xffffff,0.85); sun.position.set(8,16,12); scene.add(sun);
const rim=new THREE.DirectionalLight(0x9ab0ff,0.4); rim.position.set(-12,6,-10); scene.add(rim);
const ground=new THREE.Mesh(new THREE.CircleGeometry(80,64),new THREE.MeshStandardMaterial({color:0x1d2747,roughness:1}));
ground.rotation.x=-Math.PI/2; scene.add(ground);
const grid=new THREE.GridHelper(120,120,0x34407a,0x26305c); grid.position.y=0.01; scene.add(grid);

const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:0.5,metalness:0.2},o));
const steel=M(0xc9d2dc,{metalness:0.6,roughness:0.35}), wood=M(0x9a6a3c,{roughness:0.8}), darkM=M(0x3b4456,{metalness:0.5});
const box=(w,h,d,m)=>new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
const cyl=(r1,r2,h,m,seg=24)=>new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,seg),m);
const UP=new THREE.Vector3(0,1,0);
function makeArrow(color){
  const m=new THREE.MeshBasicMaterial({color,transparent:true,opacity:0});
  const g=new THREE.Group(); const body=cyl(0.09,0.09,1,m,12); body.position.y=0.5; g.add(body);
  const head=new THREE.Mesh(new THREE.ConeGeometry(0.26,0.55,16),m); g.add(head);
  g.userData={m,body,head};
  g.set=(from,dir,len,op)=>{ // dir: unit Vector3
    const bl=Math.max(len-0.5,0.05); body.scale.y=bl; body.position.y=bl/2; head.position.y=bl+0.27;
    g.position.copy(from); g.quaternion.setFromUnitVectors(UP,dir); m.opacity=op; g.visible=op>0.01; };
  scene.add(g); return g;
}
function seg(mesh,x,y1,y2,z=0){ const l=Math.max(Math.abs(y2-y1),0.001); mesh.scale.y=l; mesh.position.set(x,(y1+y2)/2,z); }

// =========== MACHINE 1: PULLEY (block and tackle) ===========
const PX=-16;
const pul=new THREE.Group(); pul.position.x=PX; scene.add(pul);
[-3.4,2.6].forEach(x=>{ const p=box(0.4,9,0.4,wood); p.position.set(x,4.5,0); pul.add(p); });
const beam=box(6.6,0.5,0.6,wood); beam.position.set(-0.4,8.75,0); pul.add(beam);
const wheelMat=M(0x8fa3b8,{metalness:0.7,roughness:0.3});
function wheel(){ const g=new THREE.Group(); const w=cyl(0.5,0.5,0.22,wheelMat,32); w.rotation.x=Math.PI/2; g.add(w);
  const spoke=box(0.85,0.1,0.24,darkM); g.add(spoke); const s2=spoke.clone(); s2.rotation.z=Math.PI/2; g.add(s2); return g; }
const wA=wheel(), wC=wheel(); wA.position.set(-1,7.6,0); wC.position.set(1,7.6,0); pul.add(wA,wC);
const topHang=box(2.6,0.18,0.3,darkM); topHang.position.set(0,8.35,0); pul.add(topHang);
[-1,1].forEach(x=>{ const h=box(0.12,0.75,0.12,darkM); h.position.set(x,8.0,0); pul.add(h); });
const botBlock=new THREE.Group(); pul.add(botBlock);
const wD=wheel(), wB=wheel(); wD.position.set(-2,0,0); wB.position.set(0,0,0); botBlock.add(wD,wB);
const bar=box(2.6,0.18,0.3,darkM); bar.position.set(-1,-0.75,0); botBlock.add(bar);
[-2,0].forEach(x=>{ const h=box(0.12,0.75,0.12,darkM); h.position.set(x,-0.4,0); botBlock.add(h); });
const hook=box(0.1,0.5,0.1,darkM); hook.position.set(-1,-1.05,0); botBlock.add(hook);
const crate=box(1.9,1.7,1.7,M(0xc8893f,{roughness:0.85})); crate.position.set(-1,-2.15,0); botBlock.add(crate);
[-0.6,0,0.6].forEach(y=>{ const s=box(1.95,0.12,1.75,M(0x8a5a26)); s.position.set(-1,-2.15+y,0); botBlock.add(s); });
const ropeMat=M(0xf2e3b3,{roughness:0.9,emissive:0xffc94d,emissiveIntensity:0});
const freeRopeMat=M(0xf2e3b3,{roughness:0.9});
const ropeGeo=new THREE.CylinderGeometry(0.06,0.06,1,8);
const ropes=[0,1,2,3].map(()=>{ const r=new THREE.Mesh(ropeGeo,ropeMat); pul.add(r); return r; });
const freeRope=new THREE.Mesh(ropeGeo,freeRopeMat); pul.add(freeRope);
const arcGeo=new THREE.TorusGeometry(0.5,0.06,8,24,Math.PI);
const arcA=new THREE.Mesh(arcGeo,freeRopeMat), arcC=arcA.clone(); arcA.position.copy(wA.position); arcC.position.copy(wC.position); pul.add(arcA,arcC);
const arcD=new THREE.Mesh(arcGeo,freeRopeMat), arcB=arcD.clone(); arcD.rotation.z=Math.PI; arcB.rotation.z=Math.PI;
arcD.position.set(-2,0,0); arcB.position.set(0,0,0); botBlock.add(arcD,arcB);
const handle=new THREE.Mesh(new THREE.SphereGeometry(0.28,16,12),M(0xff7a3d)); pul.add(handle);
const pWeight=makeArrow(0xff5a5a), pPull=makeArrow(0x4ee28a);

// =========== MACHINE 2: HYDRAULIC LIFT ===========
const HX=0;
const hyd=new THREE.Group(); hyd.position.x=HX; scene.add(hyd);
const glass=new THREE.MeshStandardMaterial({color:0xbfe3ff,transparent:true,opacity:0.22,roughness:0.1,metalness:0.1,side:THREE.DoubleSide,depthWrite:false});
const fluidMat=new THREE.MeshStandardMaterial({color:0x2f8cff,roughness:0.25,emissive:0x2f8cff,emissiveIntensity:0.1});
const SR=0.5, BR=1.4, SXp=-2.6, BXp=1.4;
const base=box(6.6,0.5,2.4,darkM); base.position.set(-0.6,0.25,0); hyd.add(base);
const smallTube=new THREE.Mesh(new THREE.CylinderGeometry(SR+0.06,SR+0.06,5.6,32,1,true),glass); smallTube.position.set(SXp,3.5,0); hyd.add(smallTube);
const bigTube=new THREE.Mesh(new THREE.CylinderGeometry(BR+0.06,BR+0.06,3.8,48,1,true),glass); bigTube.position.set(BXp,2.6,0); hyd.add(bigTube);
const pipeG=box(4.2,0.8,1.0,glass); pipeG.position.set(-0.6,1.1,0); hyd.add(pipeG);
const pipeF=box(4.1,0.7,0.9,fluidMat); pipeF.position.set(-0.6,1.1,0); hyd.add(pipeF);
const unitCylS=new THREE.CylinderGeometry(SR,SR,1,32), unitCylB=new THREE.CylinderGeometry(BR,BR,1,48);
const fluidS=new THREE.Mesh(unitCylS,fluidMat), fluidB=new THREE.Mesh(unitCylB,fluidMat); hyd.add(fluidS,fluidB);
const pistonMat=M(0xd0d6de,{metalness:0.7,roughness:0.3,emissive:0xffc94d,emissiveIntensity:0});
const pistonS=cyl(SR,SR,0.25,pistonMat,32), pistonB=cyl(BR,BR,0.3,pistonMat,48); hyd.add(pistonS,pistonB);
const rodS=cyl(0.1,0.1,1,steel,12), rodB=cyl(0.3,0.3,1,steel,16); hyd.add(rodS,rodB);
const knob=cyl(0.45,0.45,0.18,M(0xff7a3d),24); hyd.add(knob);
const platform=box(3.4,0.18,2.2,darkM); hyd.add(platform);
const car=new THREE.Group(); hyd.add(car);
{ const body=box(2.9,0.55,1.4,M(0xe8443a,{metalness:0.4,roughness:0.35})); body.position.y=0.55; car.add(body);
  const cab=box(1.5,0.5,1.25,M(0xe8443a,{metalness:0.4,roughness:0.35})); cab.position.set(-0.15,1.05,0); car.add(cab);
  const win=box(1.52,0.32,1.27,M(0x9fd4ff,{metalness:0.6,roughness:0.1})); win.position.set(-0.15,1.07,0); car.add(win);
  [[-0.95,0.7],[0.95,0.7],[-0.95,-0.7],[0.95,-0.7]].forEach(([x,z])=>{ const w=cyl(0.3,0.3,0.22,M(0x1b1b1b),20); w.rotation.x=Math.PI/2; w.position.set(x,0.3,z); car.add(w); }); }
const hSmall=makeArrow(0x4ee28a), hBig=makeArrow(0xffc94d);
const pArrows=[]; // pressure arrows in the liquid
[[SXp,2.2,0, -1,0,0],[SXp,2.2,0, 1,0,0],[-0.6,1.1,0.3, 0,-1,0],[-1.6,1.1,0, 0,1,0],[0.4,1.1,0, 0,1,0],
 [BXp-0.9,2.2,0,-1,0,0],[BXp+0.9,2.2,0,1,0,0],[BXp,2.6,0,0,1,0],[BXp,1.6,0.6,0,0,1],[SXp,1.6,0,0,-1,0]].forEach(a=>{
  const ar=makeArrow(0xffffff); ar.cfg=a; ar.scale.setScalar(0.45); pArrows.push(ar); });

// =========== MACHINE 3: ELECTRIC MOTOR ===========
const MX=16, MY=2.6;
const mot=new THREE.Group(); mot.position.set(MX,0,0); scene.add(mot);
const board=box(7.4,0.4,6.4,M(0x5a3d26,{roughness:0.85})); board.position.set(0,0.2,-0.6); mot.add(board);
const magN=box(1.3,3.0,2.8,M(0xe0383b,{roughness:0.45})); magN.position.set(-2.6,MY,0); mot.add(magN);
const magS=box(1.3,3.0,2.8,M(0x2d6be0,{roughness:0.45})); magS.position.set(2.6,MY,0); mot.add(magS);
[-2.6,2.6].forEach(x=>{ const s=box(1.3,MY-1.5,2.8,darkM); s.position.set(x,(MY-1.5)/2+0.4,0); mot.add(s); });
const fieldMat=new THREE.MeshBasicMaterial({color:0x9fc8ff,transparent:true,opacity:0});
const fieldLines=[];
[[0.9,0.9],[0.9,-0.9],[-0.9,0.9],[-0.9,-0.9],[0,0],[0,0.95],[0,-0.95]].forEach(([y,z])=>{
  const l=cyl(0.025,0.025,3.9,fieldMat,6); l.rotation.z=Math.PI/2; l.position.set(0,MY+y,z); mot.add(l);
  const h=new THREE.Mesh(new THREE.ConeGeometry(0.09,0.22,10),fieldMat); h.rotation.z=-Math.PI/2; h.position.set(0.4,MY+y,z); mot.add(h); fieldLines.push(l,h); });
const coil=new THREE.Group(); coil.position.set(0,MY,0); mot.add(coil);
const copper=M(0xd2803e,{metalness:0.8,roughness:0.3,emissive:0xffa040,emissiveIntensity:0});
const CW=1.25, CL=1.25;
function rod(a,b,r,mat){ const d=new THREE.Vector3().subVectors(b,a); const m=cyl(r,r,d.length(),mat,10);
  m.position.copy(a).addScaledVector(d,0.5); m.quaternion.setFromUnitVectors(UP,d.clone().normalize()); return m; }
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const loopPts=[V(-0.12,0,-2.0),V(-0.12,0,-CL),V(-CW,0,-CL),V(-CW,0,CL),V(CW,0,CL),V(CW,0,-CL),V(0.12,0,-CL),V(0.12,0,-2.0)];
for(let i=0;i<loopPts.length-1;i++) coil.add(rod(loopPts[i],loopPts[i+1],0.07,copper));
const commMat=M(0xe0a050,{metalness:0.8,roughness:0.25,emissive:0xffd060,emissiveIntensity:0});
[0,Math.PI].forEach(a=>{ const h=new THREE.Mesh(new THREE.CylinderGeometry(0.32,0.32,0.6,24,1,false,a+0.12,Math.PI-0.24),commMat);
  h.rotation.x=Math.PI/2; h.rotation.y=0; h.position.z=-2.25; coil.add(h); });
const axle=cyl(0.06,0.06,4.6,steel,10); axle.rotation.x=Math.PI/2; axle.position.set(0,MY,-0.6); mot.add(axle);
const stand=box(0.25,MY-0.4,0.25,darkM); stand.position.set(0,(MY-0.4)/2+0.4,1.7); mot.add(stand);
const stand2=stand.clone(); stand2.position.z=-2.9; mot.add(stand2);
const brushes=[-1,1].map(s=>{ const b=box(0.3,0.22,0.35,M(0x222222)); b.position.set(s*0.48,MY,-2.25); mot.add(b); return b; });
const battery=new THREE.Group(); battery.position.set(0,0.85,-3.2); mot.add(battery);
{ const c=cyl(0.45,0.45,2.2,M(0x2b2b2b),24); c.rotation.z=Math.PI/2; battery.add(c);
  const cap=cyl(0.46,0.46,0.6,M(0xf0b429),24); cap.rotation.z=Math.PI/2; cap.position.x=0.8; battery.add(cap);
  const tip=cyl(0.15,0.15,0.2,steel,12); tip.rotation.z=Math.PI/2; tip.position.x=1.2; battery.add(tip); }
const wireM=M(0x222831,{emissive:0xff4d4d,emissiveIntensity:0});
[[V(-0.6,MY,-2.25),V(-1.4,MY-0.4,-2.4),V(-1.6,0.9,-3.0),V(-1.15,0.85,-3.2)],
 [V(0.6,MY,-2.25),V(1.4,MY-0.4,-2.4),V(1.6,0.9,-3.0),V(1.3,0.85,-3.2)]].forEach(p=>{
  mot.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(p),40,0.05,8,false),wireM)); });
const curPath=new THREE.CurvePath(); for(let i=0;i<loopPts.length-1;i++) curPath.add(new THREE.LineCurve3(loopPts[i],loopPts[i+1]));
const curDotMat=new THREE.MeshBasicMaterial({color:0xfff07a,transparent:true,opacity:0});
const curDots=[]; for(let i=0;i<16;i++){ const d=new THREE.Mesh(new THREE.SphereGeometry(0.1,10,8),curDotMat); coil.add(d); curDots.push(d); }
const fUp=makeArrow(0x4ee28a), fDown=makeArrow(0xff5a5a);

// ---------- labels ----------
const labelsEl=document.getElementById('labels');
const LBL=[];
function label(text,cls,posFn,from,to){ const d=document.createElement('div'); d.className='label '+(cls||''); d.textContent=text; labelsEl.appendChild(d); LBL.push({d,posFn,from,to}); }
const wp=(g,x,y,z)=>()=>g.localToWorld(V(x,y,z));

// ---------- timeline ----------
const P0=firstOf('pulley'), H0=firstOf('hyd'), M0=firstOf('motor'), O0=firstOf('outro');
const SHOTS=[ // [time, camPos, target]
  [0,           [1,9,21],             [0,4.4,0]],
  [P0.start-0.2,[PX+4.5,6.5,13.5],    [PX-0.6,3.6,0]],
  [L(4).start,  [PX+3,5.6,13],        [PX-0.4,3.6,0]],
  [H0.start-0.2,[HX+4,6.2,10.5],      [HX-0.4,2.4,0]],
  [L(8).start,  [HX+5,6.0,12.5],      [HX+0.1,3.0,0]],
  [M0.start-0.2,[MX+2,8.2,10.5],      [MX,2.2,-0.8]],
  [L(11).start, [MX+1,6.6,9.6],       [MX,2.4,-0.6]],
  [O0.start,    [1,9,21],             [0,4.4,0]],
];
LBL.length=0;
label("Heavy crate","red",wp(botBlock,-1,-2.15,1.2),L(2).start,L(3).end);
label("4 ropes share the weight","",wp(pul,-1,6.2,0.6),L(3).start+0.6,L(4).end);
label("Pull 4x farther","green",()=>handle.localToWorld(V(1.6,0.2,0)).clone(),L(4).start+0.5,L(4).end+0.9);
label("Crate rises 1x","",wp(botBlock,-1,-0.2,1.6),L(4).start+1.2,L(4).end+0.9);
label("Small piston","green",wp(hyd,SXp,6.6,0),L(6).start,L(7).end);
label("Liquid","blue",wp(hyd,-0.6,1.1,1.3),L(7).start,L(7).end);
label("Small area","green",()=>pistonS.localToWorld(V(0,0.2,0)).clone().add(V(-1.2,0,0)),L(8).start,L(8).end);
label("BIG area = BIG force","",wp(hyd,BXp,4.0,1.9),L(8).start+0.6,L(8).end+0.8);
label("N","red",wp(mot,-2.6,MY+1.9,0),M0.start,lastOf('motor').end+0.9);
label("S","blue",wp(mot,2.6,MY+1.9,0),M0.start,lastOf('motor').end+0.9);
label("Wire loop","",wp(mot,0,MY+1.7,1.3),L(10).start,L(10).end);
label("Battery","",wp(mot,0,0.9,-4.0),L(10).start,L(10).end);
label("Push UP","green",()=>fUp.localToWorld(V(0,2.0,0)).clone(),L(11).start+0.8,L(11).end);
label("Push DOWN","red",()=>fDown.localToWorld(V(0,2.0,0)).clone(),L(11).start+0.8,L(11).end);
label("Commutator (flips the current)","",wp(mot,0,MY-0.7,-2.3),L(12).start,L(12).end+0.6);

const NAMES={pulley:["MACHINE 1 / 3","THE PULLEY",0],hyd:["MACHINE 2 / 3","HYDRAULIC LIFT",1],motor:["MACHINE 3 / 3","ELECTRIC MOTOR",2]};
const dots=[...document.querySelectorAll('#dots span')];
const sub=document.getElementById('sub'), badge=document.getElementById('badge'), big=document.getElementById('big');

// motor rotation
const motOmega=t=>4.2*smooth(L(11).start+0.2,L(11).start+2.6,t);
function motAngle(t){ let a=0,n=300,dt=t/n; for(let i=0;i<n;i++) a+=motOmega((i+0.5)*dt)*dt; return a; }

function camAt(t){
  let i=0; while(i<SHOTS.length-1 && t>=SHOTS[i+1][0]) i++;
  const A=SHOTS[i], B=SHOTS[Math.min(i+1,SHOTS.length-1)];
  const tr=(B===A)?1:Math.min(1.6, B[0]-A[0]); const k=(B===A)?0:smooth(B[0]-tr,B[0],t);
  const p=A[1].map((x,j)=>lerp(x,B[1][j],k)), g=A[2].map((x,j)=>lerp(x,B[2][j],k));
  const sway=Math.sin(t*0.35)*0.8;
  camera.position.set(p[0]+sway,p[1],p[2]); camera.lookAt(g[0],g[1],g[2]);
}
const tmp=V(0,0,0);
let lastLine=-2, lastM='';
function renderAt(t){
  t=clamp(t,0,DURATION);
  camAt(t);

  // ----- pulley -----
  const h=1.0*smooth(L(4).start+0.2,L(4).end-0.2,t);
  const yb=2.75+h; botBlock.position.y=yb;
  seg(ropes[0],-2.5,yb,8.5); seg(ropes[1],-1.5,yb,7.6); seg(ropes[2],-0.5,yb,7.6); seg(ropes[3],0.5,yb,7.6);
  const yFree=4.4-4*h; seg(freeRope,1.5,yFree,7.6); handle.position.set(1.5,yFree,0);
  ropeMat.emissiveIntensity=0.9*win(L(3).start+0.5,L(4).end,t,0.4);
  const spin=h/0.5; wA.rotation.z=spin*2; wC.rotation.z=-spin*4; wD.rotation.z=-spin; wB.rotation.z=spin*3;
  const wOp=win(L(2).start,L(3).end,t);
  pWeight.set(botBlock.localToWorld(V(-1,-1.2,1.3)),V(0,-1,0),1.7,wOp);
  const pOp=win(L(4).start+0.3,L(4).end+0.9,t);
  pPull.set(handle.localToWorld(V(0,-0.35,0)),V(0,-1,0),1.0,pOp);

  // ----- hydraulic -----
  const d=3.6*smooth(L(6).start+0.2,L(8).end-0.6,t);
  const ys=5.6-d, ybp=2.6+d*(SR*SR)/(BR*BR);
  seg(fluidS,SXp,0.75,ys); seg(fluidB,BXp,0.75,ybp);
  pistonS.position.set(SXp,ys+0.12,0); pistonB.position.set(BXp,ybp+0.15,0);
  seg(rodS,SXp,ys+0.2,ys+2.1); knob.position.set(SXp,ys+2.15,0);
  seg(rodB,BXp,ybp+0.25,ybp+1.9); platform.position.set(BXp,ybp+1.95,0); car.position.set(BXp,ybp+2.04,0);
  const press=win(L(7).start,L(7).end+0.4,t);
  fluidMat.emissiveIntensity=0.1+0.5*press*(0.6+0.4*Math.sin(t*9));
  pArrows.forEach((a,i)=>{ const c=a.cfg; const pulse=0.15*Math.sin(t*6+i);
    a.set(hyd.localToWorld(V(c[0],c[1],c[2])),V(c[3],c[4],c[5]),1.0+pulse,press); a.scale.setScalar(0.45); });
  pistonMat.emissiveIntensity=0.6*win(L(8).start,L(8).end,t);
  hSmall.set(hyd.localToWorld(V(SXp,ys+3.9,0)),V(0,-1,0),1.4,win(L(6).start,L(8).end+0.6,t));
  hBig.set(hyd.localToWorld(V(BXp+2.3,ybp+0.4,0)),V(0,1,0),3.2,win(L(8).start+0.4,L(8).end+0.8,t));

  // ----- motor -----
  const th=-motAngle(t); coil.rotation.z=th;
  const glow=smooth(L(10).start+0.5,L(10).start+1.5,t);
  copper.emissiveIntensity=0.35*glow; wireM.emissiveIntensity=0.5*glow; curDotMat.opacity=glow;
  curDots.forEach((dd,i)=>{ const u=((i/curDots.length)+t*0.18)%1; curPath.getPointAt(u,dd.position); });
  fieldMat.opacity=0.55*smooth(M0.start,M0.start+1,t);
  const fOp=win(L(11).start,lastOf('motor').end+0.6,t);
  // force arrows sit on whichever long side is currently on the left / right
  const s1x=CW*Math.cos(th), s1y=CW*Math.sin(th);
  const left = s1x<0 ? [s1x,s1y] : [-s1x,-s1y], right=[-left[0],-left[1]];
  fUp.set(mot.localToWorld(V(left[0],MY+left[1]+0.15,0.6)),V(0,1,0),1.7,fOp);
  fDown.set(mot.localToWorld(V(right[0],MY+right[1]-0.15,0.6)),V(0,-1,0),1.7,fOp);
  // commutator flash when the gap passes the brushes (every half turn)
  const ph=((th%Math.PI)+Math.PI)%Math.PI; const near=Math.min(ph,Math.PI-ph);
  commMat.emissiveIntensity=win(L(12).start,lastOf('motor').end+0.6,t)*(near<0.35?1.2:0.15);

  renderer.render(scene,camera);

  // ----- overlay -----
  let li=-1; LINES.forEach((l,i)=>{ if(t>=l.start-0.05) li=i; });
  const line=li>=0?LINES[li]:null;
  const subOn = line && t<=line.end+0.25 && line.m!=='intro' && line.m!=='outro';
  if(li!==lastLine){ sub.textContent=line?line.text:''; lastLine=li; }
  sub.style.opacity=subOn?1:0;
  const m=line?line.m:'intro';
  const nm=NAMES[m];
  badge.style.opacity=nm?smooth(firstOf(m).start-0.6,firstOf(m).start,t):0;
  if(nm && m!==lastM){ document.getElementById('bnum').textContent=nm[0]; document.getElementById('bname').textContent=nm[1]; dots.forEach((s,i)=>s.classList.toggle('on',i<=nm[2])); lastM=m; }
  const introOp=1-smooth(P0.start-1.2,P0.start-0.5,t), outroOp=smooth(O0.start-0.3,O0.start+0.4,t);
  if(outroOp>0){ big1.textContent="SIMPLE SCIENCE"; big2.textContent="HUGE POWER!"; big3.textContent="Which machine should we explain next?"; big.style.opacity=outroOp; }
  else { big1.textContent="3 MACHINES"; big2.textContent="Explained in 60 seconds"; big3.textContent="Pulley  •  Hydraulic lift  •  Motor"; big.style.opacity=introOp; }
  document.getElementById('bar').style.width=(t/DURATION*100)+'%';
  const cw=W(), ch=H();
  LBL.forEach(l=>{ const o=win(l.from,l.to,t,0.35); if(o<0.01){ l.d.style.display='none'; return; }
    tmp.copy(l.posFn()).project(camera); l.d.style.display=tmp.z<1?'block':'none'; l.d.style.opacity=o;
    l.d.style.left=clamp((tmp.x+1)/2*cw,70,cw-70)+'px'; l.d.style.top=((1-tmp.y)/2*ch)+'px'; });
}
const big1=document.getElementById('big1'), big2=document.getElementById('big2'), big3=document.getElementById('big3');
window.renderAt=renderAt; window.DURATION=DURATION;
function resize(){ renderer.setSize(W(),H()); camera.aspect=W()/H(); camera.fov=camera.aspect<1?62:45; camera.updateProjectionMatrix(); }
window.addEventListener('resize',resize); resize();
if(location.hash==='#capture'){ document.body.classList.add('capture'); renderAt(0); }
else { let start=performance.now(); document.getElementById('replay').onclick=()=>{start=performance.now();};
  (function loop(){ renderAt(Math.min((performance.now()-start)/1000,DURATION)); requestAnimationFrame(loop); })(); }
})();
</script>
</body>
</html>
