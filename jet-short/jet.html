<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How a Jet Engine Works</title>
<style>
  :root { --bg:#0a1430; --ink:#f4f7fb; --accent:#ffc94d; --cold:#6fd3ff; --hot:#ff7a3d; }
  html,body { margin:0; height:100%; background:var(--bg); overflow:hidden;
    font-family:"Segoe UI", Roboto, Helvetica, Arial, sans-serif; color:var(--ink); }
  #stage { position:fixed; inset:0; } canvas { display:block; }
  #shade { position:absolute; left:0; right:0; bottom:0; height:44%; pointer-events:none;
    background:linear-gradient(to top, rgba(5,9,24,.3) 0%, rgba(5,9,24,.9) 30%, rgba(5,9,24,.5) 62%, rgba(5,9,24,0) 100%); }
  #topshade { position:absolute; left:0; right:0; top:0; height:21%; pointer-events:none;
    background:linear-gradient(to bottom, rgba(5,9,24,.88), rgba(5,9,24,0)); }
  #head { position:absolute; top:5%; left:0; right:0; text-align:center; }
  #head .t { font-size:27px; font-weight:900; letter-spacing:1px; text-shadow:0 3px 14px rgba(0,0,0,.7); }
  #steps { display:flex; justify-content:center; gap:6px; margin-top:10px; }
  #steps span { font-weight:900; font-size:15px; letter-spacing:1px; padding:5px 10px; border-radius:999px;
    background:rgba(255,255,255,.1); color:rgba(255,255,255,.55); border:2px solid rgba(255,255,255,.15); }
  #steps span.on { background:var(--accent); color:#1b1b1b; border-color:var(--accent); }
  #steps span.done { color:#fff; border-color:rgba(255,201,77,.6); }
  #chip { display:inline-block; margin-top:8px; background:var(--accent); color:#1b1b1b; font-weight:800;
    border-radius:999px; padding:5px 14px; font-size:15px; letter-spacing:1px; }
  #sub { position:absolute; left:6%; right:6%; bottom:22%; text-align:center; font-weight:800;
    font-size:27px; line-height:1.28; text-shadow:0 2px 0 #000, 0 0 12px rgba(0,0,0,.85); }
  #big { position:absolute; left:4%; right:4%; top:9%; text-align:center; }
  #big .l1 { font-size:26px; font-weight:800; color:var(--cold); letter-spacing:1px; }
  #big .l2 { font-size:46px; font-weight:900; line-height:1.1; margin-top:6px; text-shadow:0 4px 18px rgba(0,0,0,.7); }
  #big .l2 em { font-style:normal; color:var(--hot); }
  .label { position:absolute; transform:translate(-50%,-50%); background:rgba(6,10,26,.9);
    border:2px solid var(--accent); color:var(--ink); border-radius:8px; padding:4px 11px;
    font-weight:800; font-size:17px; white-space:nowrap; pointer-events:none; }
  .label.cold { border-color:var(--cold); } .label.hot { border-color:var(--hot); } .label.green { border-color:#4ee28a; } .label.red { border-color:#ff5a5a; }
  .label.big { font-size:21px; padding:6px 14px; }
  #bar { position:absolute; left:0; bottom:0; height:6px; background:linear-gradient(90deg,#6fd3ff,#ff7a3d); width:0; }
  #replay { position:absolute; top:12px; right:12px; background:var(--accent); border:0; color:#1b1b1b;
    font-weight:700; border-radius:8px; padding:8px 12px; cursor:pointer; font-size:14px; }
  body.capture #replay { display:none; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="topshade"></div>
<div id="shade"></div>
<div id="head"><div class="t">HOW A JET ENGINE WORKS</div>
  <div id="steps"><span>SUCK</span><span>SQUEEZE</span><span>BANG</span><span>BLOW</span></div>
  <div id="chip"></div></div>
<div id="big"><div class="l1" id="big1"></div><div class="l2" id="big2"></div></div>
<div id="labels"></div>
<div id="sub"></div>
<div id="bar"></div>
<button id="replay">↻ Replay</button>
<script src="three.min.js"></script>
<script>
const TIMING = {
 "lines": [
  {
   "m": "hook",
   "text": "How does a jet engine push a giant plane through the sky? It comes down to four simple steps. Suck, squeeze, bang, blow!",
   "start": 0.5,
   "end": 7.92
  },
  {
   "m": "intro",
   "text": "Let's slice one open, and look inside.",
   "start": 9.12,
   "end": 11.28
  },
  {
   "m": "suck",
   "text": "Step one: suck. A giant fan at the front pulls in huge amounts of air.",
   "start": 12.48,
   "end": 17.0
  },
  {
   "m": "squeeze",
   "text": "Step two: squeeze. Rows of smaller blades squash the air tighter and tighter, making it hot and high pressure.",
   "start": 18.2,
   "end": 24.69
  },
  {
   "m": "bang",
   "text": "Step three: bang. Fuel is sprayed in and burns, so the air expands with incredible force.",
   "start": 25.89,
   "end": 31.31
  },
  {
   "m": "blow",
   "text": "Step four: blow. The hot gas blasts out of the back at super high speed.",
   "start": 32.51,
   "end": 36.84
  },
  {
   "m": "turbine",
   "text": "On its way out, it spins a turbine. The turbine turns a shaft that powers the fan and the compressor, so the engine keeps itself running!",
   "start": 38.04,
   "end": 46.01
  },
  {
   "m": "newton",
   "text": "Here's the science. Newton's third law: every action has an equal and opposite reaction.",
   "start": 47.21,
   "end": 52.57
  },
  {
   "m": "newton",
   "text": "Throw air backwards, and the engine gets pushed forwards. That's thrust!",
   "start": 52.87,
   "end": 56.67
  },
  {
   "m": "bypass",
   "text": "Fun fact: most of the push actually comes from cool air that the big fan blows around the outside of the core.",
   "start": 57.87,
   "end": 64.25
  },
  {
   "m": "outro",
   "text": "Suck, squeeze, bang, blow. That's how you fly! Follow for more science made simple.",
   "start": 65.45,
   "end": 70.42
  }
 ],
 "duration": 72.22
};
(function(){
const LINES=TIMING.lines, DURATION=TIMING.duration, L=i=>LINES[i];
const W=()=>window.innerWidth, H=()=>window.innerHeight;
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const smooth=(a,b,x)=>{const k=clamp((x-a)/(b-a),0,1);return k*k*(3-2*k);};
const lerp=(a,b,k)=>a+(b-a)*k;
const win=(a,b,t,f=0.4)=>smooth(a,a+f,t)*(1-smooth(b-f,b,t));
const V=(x,y,z)=>new THREE.Vector3(x,y,z), TAU=Math.PI*2;
let seed=11; const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};

const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2)); renderer.outputEncoding=THREE.sRGBEncoding;
document.getElementById('stage').appendChild(renderer.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x0a1430);
const camera=new THREE.PerspectiveCamera(62,1,0.1,300);
scene.add(new THREE.HemisphereLight(0xdfe9ff,0x141c3a,0.6));
const key=new THREE.DirectionalLight(0xffffff,1.0); key.position.set(-4,9,10); scene.add(key);
const rim=new THREE.DirectionalLight(0x7fb0ff,0.5); rim.position.set(8,-3,-8); scene.add(rim);
const fireLight=new THREE.PointLight(0xff8a3d,0,4.5); fireLight.position.set(0.3,0,0.4); scene.add(fireLight);

function glowTex(){ const c=document.createElement('canvas'); c.width=c.height=128; const g=c.getContext('2d');
  const r=g.createRadialGradient(64,64,0,64,64,64); r.addColorStop(0,'rgba(255,255,255,1)'); r.addColorStop(0.3,'rgba(255,255,255,.5)'); r.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=r; g.fillRect(0,0,128,128); return new THREE.CanvasTexture(c); }
const GLOW=glowTex();
function sprite(color,size,op=1,add=true){ const s=new THREE.Sprite(new THREE.SpriteMaterial({map:GLOW,color,transparent:true,opacity:op,blending:add?THREE.AdditiveBlending:THREE.NormalBlending,depthWrite:false}));
  s.scale.set(size,size,1); scene.add(s); return s; }
// sky: soft clouds drifting past
const clouds=[]; for(let i=0;i<26;i++){ const s=sprite(0x9fb6e8,6+rnd()*8,0,false); s.userData={x:-30+rnd()*60,y:-8+rnd()*16,z:-14-rnd()*12,o:0.06+rnd()*0.08}; clouds.push(s); }

// ---------- materials ----------
const fadeMats=[];
const metal=(c,o={})=>new THREE.MeshPhysicalMaterial(Object.assign({color:c,metalness:0.75,roughness:0.3,clearcoat:0.5},o));
const shellBack=metal(0xb4bfcf,{metalness:0.3,roughness:0.35,side:THREE.DoubleSide});
const shellFront=metal(0xdfe5ee,{metalness:0.3,roughness:0.35,side:THREE.DoubleSide,transparent:true,opacity:1}); fadeMats.push(shellFront);
const coreBack=metal(0x5d6a80,{side:THREE.DoubleSide});
const coreFront=metal(0x5d6a80,{side:THREE.DoubleSide,transparent:true,opacity:1}); fadeMats.push(coreFront);
const bladeM=metal(0xc3cede,{metalness:0.85,roughness:0.22});
const compM=metal(0x9fb2c9,{emissive:0x8a6cff,emissiveIntensity:0});
const statorM=metal(0x56627a);
const turbM=metal(0xb08a5e,{emissive:0xff5a1f,emissiveIntensity:0});
const shaftM=metal(0xd8dee8,{emissive:0xffc94d,emissiveIntensity:0});

// half-shells along +x (back half = z<0 always visible; front half fades for the cut-away)
function shell(r0,r1,x0,x1,back,front){ const g=new THREE.Group();
  [[back,Math.PI/2],[front,-Math.PI/2]].forEach(([m,ts])=>{ const c=new THREE.Mesh(new THREE.CylinderGeometry(r1,r0,x1-x0,64,1,true,ts,Math.PI),m);
    c.rotation.z=-Math.PI/2; c.position.x=(x0+x1)/2; g.add(c); }); scene.add(g); return g; }
const eng=new THREE.Group(); scene.add(eng);
shell(1.95,1.72,-4.1,2.6,shellBack,shellFront);
const lip=new THREE.Mesh(new THREE.TorusGeometry(1.95,0.12,16,80),shellBack); lip.rotation.y=Math.PI/2; lip.position.x=-4.1; scene.add(lip);
shell(1.12,0.95,-2.95,2.15,coreBack,coreFront);
shell(0.95,0.78,2.15,2.95,coreBack,coreFront);
// spinner + shaft + tail cone
const spinner=new THREE.Mesh(new THREE.ConeGeometry(0.5,1.0,40),metal(0x2a3142,{metalness:0.5})); spinner.rotation.z=Math.PI/2; spinner.position.x=-4.05; scene.add(spinner);
const swirl=new THREE.Mesh(new THREE.TorusGeometry(0.25,0.03,8,40,Math.PI*1.2),new THREE.MeshBasicMaterial({color:0xffffff})); swirl.rotation.y=Math.PI/2; swirl.position.x=-4.32; scene.add(swirl);
const shaft=new THREE.Mesh(new THREE.CylinderGeometry(0.13,0.13,6.0,20),shaftM); shaft.rotation.z=Math.PI/2; shaft.position.x=-1.0; scene.add(shaft);
const tail=new THREE.Mesh(new THREE.ConeGeometry(0.48,1.6,40),metal(0x48505f)); tail.rotation.z=-Math.PI/2; tail.position.x=2.85; scene.add(tail);

// bladed disks rotating about x
function disk(n,rIn,rOut,chord,twist,mat,x,thick=0.04){ const g=new THREE.Group(); g.position.x=x;
  const len=rOut-rIn, geo=new THREE.BoxGeometry(chord,len,thick); geo.translate(0,rIn+len/2,0);
  for(let i=0;i<n;i++){ const holder=new THREE.Group(); holder.rotation.x=i*TAU/n; const b=new THREE.Mesh(geo,mat); b.rotation.y=twist; holder.add(b); g.add(holder); }
  const hub=new THREE.Mesh(new THREE.CylinderGeometry(rIn,rIn,chord*1.2,32),statorM); hub.rotation.z=Math.PI/2; g.add(hub);
  scene.add(g); return g; }
const fan=disk(18,0.42,1.82,0.62,0.62,bladeM,-3.55,0.05);
const comps=[], stators=[];
for(let i=0;i<6;i++){ const x=-2.65+i*0.36, ro=lerp(1.05,0.78,i/5); comps.push(disk(26,0.42,ro,0.16,0.7,compM,x));
  if(i<5) stators.push(disk(26,0.42,ro-0.02,0.1,-0.7,statorM,x+0.18)); }
const turbs=[]; for(let i=0;i<3;i++) turbs.push(disk(30,0.42,lerp(0.82,0.9,i/2),0.2,-0.75,turbM,1.15+i*0.3));
// combustor ring + fuel nozzles
const comb=new THREE.Mesh(new THREE.TorusGeometry(0.74,0.2,16,64),metal(0x3a4256,{side:THREE.DoubleSide})); comb.rotation.y=Math.PI/2; comb.position.x=-0.25; scene.add(comb);
for(let i=0;i<10;i++){ const a=i*TAU/10; const n=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,0.3,8),metal(0xd4a64a)); n.rotation.z=Math.PI/2;
  n.position.set(-0.45,Math.cos(a)*0.74,Math.sin(a)*0.74); scene.add(n); }
const flames=[]; for(let i=0;i<70;i++){ const s=sprite(i%3?0xff8a2b:0xffd24a,0.35,0); s.userData={a:rnd()*TAU,ph:rnd(),r:0.55+rnd()*0.4}; flames.push(s); }
const fuel=[]; for(let i=0;i<30;i++){ const s=sprite(0x9fe8ff,0.12,0); s.userData={a:Math.floor(rnd()*10)*TAU/10,ph:rnd()}; fuel.push(s); }
// exhaust glow
const plume=[]; for(let i=0;i<40;i++){ const s=sprite(i%2?0xff6a2b:0xffb04a,0.9,0); s.userData={ph:rnd(),r:rnd()*0.55,a:rnd()*TAU}; plume.push(s); }
// wing + pylon (only for the opening shot)
const wingM=metal(0xe9eef5,{metalness:0.2,transparent:true,opacity:1}); fadeMats.push(wingM);
const pylon=new THREE.Mesh(new THREE.BoxGeometry(4.2,0.9,0.35),wingM); pylon.position.set(-0.6,2.25,0); scene.add(pylon);
const wing=new THREE.Mesh(new THREE.BoxGeometry(5.5,0.28,16),wingM); wing.position.set(0.2,2.85,-4); wing.rotation.y=0.25; scene.add(wing);

// ---------- airflow particles ----------
const piece=(u,K)=>{ for(let i=0;i<K.length-1;i++){ if(u<=K[i+1][0]){ const k=(u-K[i][0])/(K[i+1][0]-K[i][0]); return lerp(K[i][1],K[i+1][1],k); } } return K[K.length-1][1]; };
const KC=[[0,-7.5],[0.2,-3.6],[0.5,-0.6],[0.6,0.9],[0.66,2.15],[1,10]];
const KB=[[0,-7.5],[0.2,-3.6],[0.72,2.6],[1,9]];
function coreRmax(x){ if(x<-3.6) return 1.0; if(x<-0.6) return lerp(1.0,0.66,(x+3.6)/3.0); if(x<2.15) return 0.9; return 0.9+(x-2.15)*0.1; }
function coreRmin(x){ if(x<2.15) return 0.3; return Math.max(0,0.3-(x-2.15)*0.15); }
const CB=new THREE.Color(0x9fdcff), CV=new THREE.Color(0x9b6cff), CY=new THREE.Color(0xffd23f), CO=new THREE.Color(0xff7a2b), CR=new THREE.Color(0xff3b2b);
function coreCol(x,out){ if(x<-3.6) return out.copy(CB); if(x<-0.6) return out.copy(CB).lerp(CV,(x+3.6)/3.0);
  if(x<0.9) return out.copy(CV).lerp(CY,clamp((x+0.6)/0.6,0,1)).lerp(CO,clamp((x-0.1)/0.8,0,1)); if(x<2.15) return out.copy(CO); return out.copy(CO).lerp(CR,clamp((x-2.15)/4,0,1)); }
const NC=300, NB=240;
const sphere=new THREE.SphereGeometry(1,10,8);
const coreP=new THREE.InstancedMesh(sphere,new THREE.MeshBasicMaterial({color:0xffffff}),NC); coreP.instanceColor=new THREE.InstancedBufferAttribute(new Float32Array(NC*3),3); scene.add(coreP);
const bypP=new THREE.InstancedMesh(sphere,new THREE.MeshBasicMaterial({color:0xffffff}),NB); bypP.instanceColor=new THREE.InstancedBufferAttribute(new Float32Array(NB*3),3); scene.add(bypP);
const cData=[], bData=[]; for(let i=0;i<NC;i++) cData.push({u:rnd(),rf:Math.sqrt(rnd()),a:rnd()*TAU}); for(let i=0;i<NB;i++) bData.push({u:rnd(),rf:rnd(),a:rnd()*TAU});
const dummy=new THREE.Object3D(), tc=new THREE.Color();

// arrows (Newton)
function makeArrow(color,r=0.16){ const m=new THREE.MeshBasicMaterial({color,transparent:true,opacity:0});
  const g=new THREE.Group(); const body=new THREE.Mesh(new THREE.CylinderGeometry(r,r,1,16),m); g.add(body); const head=new THREE.Mesh(new THREE.ConeGeometry(r*2.8,r*6,20),m); g.add(head);
  g.set=(from,dir,len,op)=>{ const hl=r*6, bl=Math.max(len-hl,0.05); body.scale.y=bl; body.position.y=bl/2; head.position.y=bl+hl/2; g.position.copy(from); g.quaternion.setFromUnitVectors(V(0,1,0),dir); m.opacity=op; g.visible=op>0.01; };
  scene.add(g); return g; }
const arBack=makeArrow(0xff5a5a,0.18), arFwd=makeArrow(0x4ee28a,0.22);
const streaks=[]; for(let i=0;i<22;i++){ const s=new THREE.Mesh(new THREE.BoxGeometry(2.4,0.03,0.03),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0})); s.userData={y:-3.5+rnd()*7,z:-3+rnd()*4,ph:rnd()}; scene.add(s); streaks.push(s); }

// ---------- labels ----------
const labelsEl=document.getElementById('labels'), LBL=[];
function label(text,cls,p,from,to){ const d=document.createElement('div'); d.className='label '+cls; d.textContent=text; labelsEl.appendChild(d); LBL.push({d,p:(typeof p==='function')?p:()=>p,from,to}); }
label("Fan","",V(-3.55,2.3,0),L(2).start+1.0,L(2).end+0.3);
label("Air in","cold",V(-6.2,1.2,0.6),L(2).start+2.4,L(2).end+0.3);
label("Compressor","",V(-1.7,1.55,0),L(3).start+1.0,L(3).end+0.3);
label("Squeezed: hot & high pressure","",V(-1.4,-1.5,0.4),L(3).start+3.6,L(3).end+0.3);
label("Fuel + fire","hot",V(-0.2,1.45,0.3),L(4).start+1.2,L(4).end+0.3);
label("Hot gas","hot",V(4.6,1.3,0),L(5).start+1.2,L(5).end+0.3);
label("Super fast!","hot",V(6.4,-1.0,0),L(5).start+2.4,L(5).end+0.3);
label("Turbine","hot",V(1.5,1.45,0),L(6).start+1.4,L(6).end+0.3);
label("Shaft","",V(-0.6,0.55,0.6),L(6).start+3.0,L(6).end+0.3);
label("Powers the fan","",V(-3.55,2.3,0),L(6).start+4.6,L(6).end+0.3);
label("Air pushed BACK","red big",V(5.2,1.2,0),L(8).start+0.3,L(8).end+0.6);
label("Engine pushed FORWARD","green big",V(-5.4,1.4,0),L(8).start+1.4,L(8).end+0.6);
label("THRUST","green big",V(-5.0,-1.4,0),L(8).start+2.6,L(8).end+0.6);
label("Cool bypass air","cold",V(-0.5,2.4,0),L(9).start+1.5,L(9).end+0.3);
label("Most of the thrust!","cold big",V(4.2,-2.3,0),L(9).start+3.0,L(9).end+0.3);

// ---------- timeline ----------
const cut=t=>smooth(L(1).start,L(1).start+1.6,t)*(1-smooth(L(10).start+0.3,L(10).start+1.8,t));
const wingFade=t=>1-smooth(L(1).start,L(1).start+1.2,t)*(1-smooth(L(10).start+0.3,L(10).start+1.8,t));
const spin=t=>0.6+4.0*smooth(L(2).start,L(2).start+2.5,t);
function integ(t,f,dt=1/60){ let a=0; for(let x=dt/2;x<t;x+=dt) a+=f(x)*dt; return a; }
const frontier=t=>{ if(t<L(2).start) return -99; if(t<L(3).start) return lerp(-7.5,-3.3,smooth(L(2).start,L(2).start+2.5,t));
  if(t<L(4).start) return lerp(-3.3,-0.5,smooth(L(3).start,L(3).start+3,t)); if(t<L(5).start) return lerp(-0.5,1.0,smooth(L(4).start,L(4).start+1.5,t));
  return lerp(1.0,12,smooth(L(5).start,L(5).start+1.6,t)); };
const flowRate=t=>0.11*smooth(L(2).start-0.5,L(2).start+1.5,t);
const fire=t=>smooth(L(4).start+0.4,L(4).start+1.4,t)*(1-smooth(L(10).start+0.5,L(10).start+2,t)*0.5);

const SHOTS=[
  [0,            [-10.5,1.8,10.5], [-1.0,1.2,0]],
  [L(1).start,   [-3.0,2.8,10.5], [0,0.4,0]],
  [L(2).start,   [-9.2,1.6,5.4],  [-3.6,0.4,0]],
  [L(3).start,   [-1.2,2.0,5.6],  [-1.6,0.1,0]],
  [L(4).start,   [0.8,1.5,4.6],   [0.0,0.1,0]],
  [L(5).start,   [7.0,2.4,6.4],   [3.6,0.2,0]],
  [L(6).start,   [0.4,2.8,11.5],  [-0.6,0.3,0]],
  [L(7).start,   [0.3,8.0,17.5],  [0,0.9,0]],
  [L(9).start,   [-1.2,4.0,10.0], [0.2,0.3,0]],
  [L(10).start,  [-11.5,2.6,13.5],[-0.6,1.0,0]],
];
function camAt(t){
  let i=0; while(i<SHOTS.length-1 && t>=SHOTS[i+1][0]) i++;
  const A=SHOTS[i], B=SHOTS[Math.min(i+1,SHOTS.length-1)];
  const k=(B===A)?0:smooth(B[0]-1.5,B[0]+0.2,t);
  const p=A[1].map((x,j)=>lerp(x,B[1][j],k)), g=A[2].map((x,j)=>lerp(x,B[2][j],k));
  camera.position.set(p[0]+Math.sin(t*0.3)*0.6,p[1]+Math.sin(t*0.2)*0.2,p[2]); camera.lookAt(g[0],g[1]-0.9,g[2]);
}
const STEPI={hook:-1,intro:-1,suck:0,squeeze:1,bang:2,blow:3,turbine:4,newton:4,bypass:4,outro:4};
const CHIPS={turbine:"BONUS · THE TURBINE",newton:"THE SCIENCE · NEWTON'S 3RD LAW",bypass:"FUN FACT"};
const sub=document.getElementById('sub'), chip=document.getElementById('chip'), head=document.getElementById('head');
const stepEls=[...document.querySelectorAll('#steps span')];
const big=document.getElementById('big'), big1=document.getElementById('big1'), big2=document.getElementById('big2');
const tmp=V(0,0,0); let lastLine=-2;

function renderAt(t){
  t=clamp(t,0,DURATION); camAt(t);
  const c=cut(t);
  shellFront.opacity=lerp(1,0.06,c); coreFront.opacity=lerp(1,0.06,c); shellFront.depthWrite=coreFront.depthWrite=c<0.5;
  wingM.opacity=wingFade(t); wing.visible=pylon.visible=wingM.opacity>0.02; wingM.depthWrite=wingM.opacity>0.5;
  // rotation
  const th=integ(t,spin); fan.rotation.x=th; spinner.rotation.x=th; swirl.rotation.x=th; comps.forEach((d,i)=>d.rotation.x=th*1.4); turbs.forEach(d=>d.rotation.x=th*1.4);
  // compressor / turbine / shaft highlights
  compM.emissiveIntensity=0.45*win(L(3).start+0.8,L(3).end+0.4,t);
  turbM.emissiveIntensity=0.15*fire(t)+0.55*win(L(6).start+0.8,L(6).end,t);
  shaftM.emissiveIntensity=0.7*win(L(6).start+2.6,L(6).end,t)*(0.6+0.4*Math.sin(t*6));
  // fire
  const f=fire(t); fireLight.intensity=1.2*f*(0.8+0.2*Math.sin(t*23));
  flames.forEach(s=>{ const d=s.userData, k=(t*1.6+d.ph)%1; s.position.set(-0.4+k*1.2,Math.cos(d.a)*d.r,Math.sin(d.a)*d.r);
    s.material.opacity=f*0.85*Math.sin(k*Math.PI); s.scale.setScalar(0.25+0.35*Math.sin(k*Math.PI)); });
  const fu=win(L(4).start+0.4,L(4).end+0.3,t);
  fuel.forEach(s=>{ const d=s.userData, k=(t*2.2+d.ph)%1; s.position.set(-0.6+k*0.4,Math.cos(d.a)*0.74,Math.sin(d.a)*0.74); s.material.opacity=fu*(1-k); });
  const ex=smooth(L(5).start,L(5).start+1.5,t)*(1-0.5*smooth(L(10).start+0.5,L(10).start+2,t));
  plume.forEach(s=>{ const d=s.userData, k=(t*1.3+d.ph)%1; const r=d.r*(1+k*1.5); s.position.set(3.2+k*5.5,Math.cos(d.a)*r,Math.sin(d.a)*r);
    s.material.opacity=ex*0.5*(1-k); s.scale.setScalar(0.7+k*1.6); });
  // particles
  const ph=integ(t,flowRate), fr=frontier(t);
  const byHi=win(L(9).start+0.6,L(9).end+0.3,t), coreDim=1-0.6*byHi;
  for(let i=0;i<NC;i++){ const d=cData[i], u=(d.u+ph)%1, x=piece(u,KC); const rmax=coreRmax(x), rmin=coreRmin(x);
    const r=rmin+d.rf*(rmax-rmin), a=d.a+x*0.25; dummy.position.set(x,Math.cos(a)*r,Math.sin(a)*r);
    let s=0.045; if(x>2.15) s*=Math.max(0,1-(x-2.15)/7.5); if(x>fr) s=0; dummy.scale.setScalar(s*(x>-0.6&&x<2.15?1.3:1));
    dummy.updateMatrix(); coreP.setMatrixAt(i,dummy.matrix); coreCol(x,tc).multiplyScalar(coreDim); coreP.setColorAt(i,tc); }
  coreP.instanceMatrix.needsUpdate=true; coreP.instanceColor.needsUpdate=true;
  for(let i=0;i<NB;i++){ const d=bData[i], u=(d.u+ph*0.95)%1, x=piece(u,KB); const r=(x<-3.6?lerp(1.0,1.8,d.rf):lerp(1.22,1.75,d.rf))+(x>2.6?(x-2.6)*0.08:0);
    const a=d.a+x*0.05; dummy.position.set(x,Math.cos(a)*r,Math.sin(a)*r);
    let s=0.04*(1+0.6*byHi); if(x>2.6) s*=Math.max(0,1-(x-2.6)/6); if(x>fr+ (fr>-3.3?3:0) || t<L(2).start+0.5) s=0; dummy.scale.setScalar(s);
    dummy.updateMatrix(); bypP.setMatrixAt(i,dummy.matrix); tc.setHex(0x7fd8ff).multiplyScalar(0.55+0.45*byHi+0.2); bypP.setColorAt(i,tc); }
  bypP.instanceMatrix.needsUpdate=true; bypP.instanceColor.needsUpdate=true;
  // Newton arrows + motion streaks
  const nw=win(L(8).start,L(8).end+0.6,t);
  arBack.set(V(3.4,0,0),V(1,0,0),2.4,nw); arFwd.set(V(-4.3,0,0),V(-1,0,0),1.7*smooth(L(8).start+1.2,L(8).start+2.2,t),nw);
  const flying=Math.max(1-smooth(L(1).start,L(1).start+1,t), win(L(8).start+1.2,L(9).end,t), smooth(L(10).start,L(10).start+1,t));
  streaks.forEach(s=>{ const d=s.userData, k=(t*0.9+d.ph)%1; s.position.set(9-k*22,d.y,d.z); s.material.opacity=flying*0.35*Math.sin(k*Math.PI); });
  clouds.forEach(s=>{ const d=s.userData; let x=((d.x+t*2.5+30)%60)-30; s.position.set(-x,d.y,d.z); s.material.opacity=d.o; });

  renderer.render(scene,camera);

  // overlay
  let li=-1; LINES.forEach((l,i)=>{ if(t>=l.start-0.05) li=i; });
  const line=li>=0?LINES[li]:null;
  if(li!==lastLine){ sub.textContent=line?line.text:''; const cc=line&&CHIPS[line.m]; chip.textContent=cc||''; chip.style.display=cc?'inline-block':'none';
    const si=line?STEPI[line.m]:-1; stepEls.forEach((e,i)=>{ e.classList.toggle('on',i===si); e.classList.toggle('done',i<si || si===4); }); lastLine=li; }
  sub.style.opacity=(line && t<=line.end+0.3 && line.m!=='outro')?1:0;
  head.style.opacity=smooth(L(1).start-0.6,L(1).start,t)*(1-smooth(L(10).start-0.4,L(10).start,t));
  const intro=1-smooth(L(1).start-0.8,L(1).start-0.2,t), outro=smooth(L(10).start-0.2,L(10).start+0.4,t);
  if(outro>0){ big1.textContent="SUCK · SQUEEZE · BANG · BLOW"; big2.innerHTML="THAT'S HOW<br>YOU <em>FLY!</em>"; big.style.opacity=outro; }
  else { big1.textContent="HOW A JET ENGINE WORKS"; big2.innerHTML="SUCK · SQUEEZE<br><em>BANG · BLOW</em>"; big.style.opacity=intro; }
  document.getElementById('bar').style.width=(t/DURATION*100)+'%';
  const cw=W(), ch=H();
  LBL.forEach(l=>{ const o=win(l.from,l.to,t,0.3); if(o<0.01){ l.d.style.display='none'; return; }
    tmp.copy(l.p()).project(camera); l.d.style.display=tmp.z<1?'block':'none'; l.d.style.opacity=o;
    const hw=l.d.offsetWidth/2+8; l.d.style.left=clamp((tmp.x+1)/2*cw,hw,cw-hw)+'px'; l.d.style.top=clamp((1-tmp.y)/2*ch,ch*0.22,ch*0.66)+'px'; });
}
window.renderAt=renderAt; window.DURATION=DURATION;
function resize(){ renderer.setSize(W(),H()); camera.aspect=W()/H(); camera.fov=camera.aspect<1?62:45; camera.updateProjectionMatrix(); }
window.addEventListener('resize',resize); resize();
if(location.hash==='#capture'){ document.body.classList.add('capture'); renderAt(0); }
else { let start=performance.now(); document.getElementById('replay').onclick=()=>{start=performance.now();};
  (function loop(){ renderAt(Math.min((performance.now()-start)/1000,DURATION)); requestAnimationFrame(loop); })(); }
})();
</script>
