  for(let k=0;k<Math.floor(h/0.6);k++){ const wv=box(w*0.7,0.18,0.02,winM); wv.position.set(b.position.x,0.4+k*0.55,b.position.z+d/2+0.01); city.add(wv); } }
// loops (pipes + flowing particles)
const pipeMat=c=>new THREE.MeshPhysicalMaterial({color:c,transparent:true,opacity:0.45,roughness:0.2,metalness:0.3,depthWrite:false});
function loop(pts,color,closed,r=0.16){ const c=new THREE.CatmullRomCurve3(pts,closed,'catmullrom',0.2); scene.add(new THREE.Mesh(new THREE.TubeGeometry(c,200,r,10,closed),pipeMat(color))); return c; }
const primary=loop([V(-9.3,3.4,0.35),V(-8.2,3.5,0.35),V(-7.0,3.7,0.35),V(-6.4,4.4,0.35),V(-6.4,1.2,0.35),V(-7.0,0.9,0.35),V(-8.2,0.9,0.35),V(-9.3,0.6,0.35),V(-9.5,1.8,0.35)],0xff5a3a,true,0.17);
const secondary=loop([V(-6.0,1.0,-0.35),V(-6.0,4.6,-0.35),V(-6.0,6.3,-0.2),V(-3,6.5,0),V(-0.4,4.2,0),V(0.8,TY,0),V(5.2,TY,0),V(5.4,1.3,0),V(3.5,0.6,0.6),V(0,0.6,1.0),V(-4,0.6,0.8),V(-6.0,1.0,-0.35)],0xbfd8ff,true,0.15);
const cooling=loop([V(4.6,0.6,-0.9),V(4.6,0.5,-6),V(3.5,0.8,-9.5),V(3.5,2.2,-10.4),V(2.4,0.8,-9.5),V(1.6,0.5,-6),V(1.6,0.6,-0.9),V(4.6,0.6,-0.9)],0x6fd3ff,true,0.14);
function flowSet(n,size){ const a=[]; for(let i=0;i<n;i++){ const s=sprite(0xffffff,size,0); s.userData={ph:i/n}; a.push(s); } return a; }
const fP=flowSet(46,0.36), fS=flowSet(64,0.38), fC=flowSet(36,0.3);
const tmpC=new THREE.Color();
// secondary colour by position along loop: water (blue) -> steam (white) -> water
function secCol(u,out){ if(u<0.12) return out.setHex(0x4f9bff).lerp(new THREE.Color(0xffffff),u/0.12); if(u<0.58) return out.setHex(0xffffff); if(u<0.66) return out.setHex(0xffffff).lerp(new THREE.Color(0x4f9bff),(u-0.58)/0.08); return out.setHex(0x4f9bff); }
function priCol(u,out){ return out.setHex(0xff3b20).lerp(new THREE.Color(0xffa040),clamp((u-0.35)/0.5,0,1)); }

// ---------- timeline ----------
function integ(t0,t,f,dt=1/60){ let a=0; for(let x=t0+dt/2;x<t;x+=dt) a+=f(x)*dt; return a; }
const cut=t=>smooth(L(5).start,L(5).start+1.4,t)*(1-smooth(L(9).start,L(9).start+1.5,t));
const priOn=t=>smooth(L(5).start+1.5,L(5).start+2.5,t), secOn=t=>smooth(L(7).start+0.8,L(7).start+2,t), turOn=t=>smooth(L(8).start+0.2,L(8).start+2.0,t);
const elecOn=t=>smooth(L(8).start+4.0,L(8).start+5.4,t), coolOn=t=>smooth(L(9).start+0.6,L(9).start+1.8,t);
const night=t=>smooth(L(10).start+0.5,L(10).start+2.5,t);
const rodIn=t=>{ let d=0.55; d=lerp(d,1.0,smooth(L(4).start+1.5,L(4).start+3.0,t)); d=lerp(d,0.15,smooth(L(4).start+5.2,L(4).start+6.6,t)); return d; };

const SHOTS=[
  [0,            t=>[P.clone().add(V(0.4,2.0,6.4)),P.clone().add(V(-0.1,-0.4,0))]],
  [L(1).start,   t=>[A.clone().add(V(0.4,0.6,9.5)),A.clone().add(V(0,-0.8,0))]],
  [L(3).start,   t=>[A.clone().add(V(0.6,1.0,17)),CC.clone().add(V(0,-1.6,0))]],
  [L(4).start,   t=>[R.clone().add(V(2.2,4.0,8.2)),R.clone().add(V(0,1.2,0))]],
  [L(5).start,   t=>[V(-4.6,5.0,10.5),V(-8.0,2.6,0)]],
  [L(6).start,   t=>[V(-6.4,3.8,6.6),V(-8.6,2.2,0)]],
  [L(7).start,   t=>[V(-3.0,5.4,9.5),V(-5.6,3.0,0)]],
  [L(8).start,   t=>[V(6.5,4.8,10.5),V(4.6,2.0,0)]],
  [L(9).start,   t=>[V(15,9.5,13),V(4.0,9.5,-9.5)]],
  [L(10).start,  t=>[V(-14,16,22),V(6,1.5,-3)]],
  [L(11).start,  t=>[V(-12+Math.sin(t*0.15)*3,14,24),V(6,1.5,-3)]],
];
function camAt(t){
  let i=0; while(i<SHOTS.length-1 && t>=SHOTS[i+1][0]) i++;
  const Av=SHOTS[i][1](t); let p=Av[0], g=Av[1];
  if(i<SHOTS.length-1){ const N=SHOTS[i+1]; const k=smooth(N[0]-1.5,N[0]+0.1,t); if(k>0){ const Bv=N[1](t); p=p.clone().lerp(Bv[0],k); g=g.clone().lerp(Bv[1],k); } }
  camera.position.set(p.x+Math.sin(t*0.3)*0.4,p.y+Math.sin(t*0.2)*0.15,p.z); camera.lookAt(g);
}
const CHIPS={hook:"",fission:"SPLITTING THE ATOM",chain:"CHAIN REACTION",control:"CONTROL RODS",reactor:"THE REACTOR",heat:"HEAT",steam:"STEAM",turbine:"TURBINE + GENERATOR",cooling:"COOLING TOWERS",green:"CLEAN POWER",outro:""};
const sub=document.getElementById('sub'), chip=document.getElementById('chip'), head=document.getElementById('head');
const FACTS={1:"Uranium-235 is one of the few atoms that split when hit by a slow neutron.",
 2:"A tiny bit of mass turns into energy: Einstein's E = mc².",
 3:"Each split frees 2–3 neutrons, so splits multiply: 1 → 3 → 9 → 27…",
 4:"Control rods contain boron or cadmium, which soak up neutrons like a sponge.",
 5:"Each fuel rod is about 4 metres long and holds hundreds of pellets.",
 6:"The water is at ~300°C but stays liquid at ~150× normal air pressure.",
 7:"The two water loops never mix, so radioactive water stays inside the dome.",
 8:"The turbine spins up to 3,000 times a minute: magnets + coils = electricity.",
 9:"A large cooling tower can be over 150 metres tall, taller than a 40-storey building.",
 10:"Nuclear power makes about 10% of the world's electricity."};
const fact=document.getElementById('fact'), factv=document.getElementById('factv'); let factOp=0, lastFact=-1;
const big=document.getElementById('big'), big1=document.getElementById('big1'), big2=document.getElementById('big2');
const tmp=V(0,0,0), bgC=new THREE.Color(); let lastLine=-2;

function renderAt(t){
  t=clamp(t,0,DURATION); camAt(t);
  // sky: dark for the "lab" scenes, daylight over the plant, night at the end
  const atPlant=Math.abs(camera.position.x)<35 ? 1:0;
  bgC.copy(DARK); if(atPlant){ bgC.copy(DAY).lerp(NIGHT,night(t)); } scene.background=bgC; scene.fog=atPlant?FOG:null; FOG.color.copy(bgC);
  ground.visible=padG.visible=!!atPlant;
  hemi.intensity=atPlant?lerp(0.75,0.25,night(t)):0.6; sun.intensity=atPlant?lerp(1.0,0.2,night(t)):0.9;
  pelletGlow.material.opacity=0.45+0.2*Math.sin(t*3);

  // ----- single fission -----
  const nIn=smooth(L(1).start+1.2,L(1).start+1.6,t)*(t<tHit?1:0);
  const k=smooth(L(1).start+1.4,tHit,t); inN.position.copy(A).add(V(lerp(-7,-0.9,k),lerp(0.6,0.1,k),0)); inN.visible=nIn>0.01; inNG.position.copy(inN.position); inNG.material.opacity=nIn*0.8;
  const wob=win(tHit,tSplit+0.1,t,0.2); nucleus.scale.set(1+0.35*wob*(0.6+0.4*Math.sin(t*30)),1-0.12*wob,1);
  const sp=Math.max(0,t-tSplit), fadeN=1-smooth(L(3).start,L(3).start+0.8,t);
  halves[0].position.set(-Math.min(sp*1.1,2.6),0,0); halves[1].position.set(Math.min(sp*1.1,2.6),0,0); halves[0].rotation.z=sp*0.8; halves[1].rotation.z=-sp*0.8;
  nucleus.visible=fadeN>0.02; nucleus.children.forEach(h=>h.scale.setScalar(Math.max(fadeN,0.01)));
  flash.position.copy(A); flash.material.opacity=sp>0?Math.max(0,1-sp/0.8):0; flash.scale.setScalar(3+sp*10);
  heatGlow.position.copy(A); heatGlow.material.opacity=(sp>0?0.6*Math.max(0,1-sp/5):0)*fadeN; heatGlow.scale.setScalar(4+sp*2.5);
  outN.forEach((o,i)=>{ const on=sp>0&&fadeN>0.02; o.m.visible=on; o.g.material.opacity=on?0.8*fadeN:0; o.m.position.copy(A).addScaledVector(OUTDIR[i],0.8+Math.min(sp*1.2,3.4)); o.g.position.copy(o.m.position); });
  // ----- chain reaction -----
  const c0=L(3).start+0.6, GT=0.72;
  chainN.forEach(c=>{ const vis=smooth(L(3).start,L(3).start+0.6,t)*(1-smooth(L(4).start-0.8,L(4).start,t)); c.g.visible=vis>0.01; if(!c.g.visible){ c.fl.material.opacity=0; c.n.material.opacity=0; return; }
    if(c.gen<0){ c.a.position.set(0,0,0); c.b.position.set(0,0,0); c.fl.material.opacity=0; c.n.material.opacity=0; return; }
    const ts=c0+c.gen*GT, u=t-ts; const sep=u>0?Math.min(u*0.9,0.7):0;
    c.a.position.set(-sep,0,0); c.b.position.set(sep,0,0); c.a.scale.setScalar(u>0?0.75:1); c.b.scale.setScalar(u>0?0.75:1);
    c.fl.position.copy(c.g.position); c.fl.material.opacity=u>0?Math.max(0,1-u/0.7)*vis:0;
    if(c.parent>=0){ const pp=chainN[c.parent], u0=ts-GT; const kk=clamp((t-u0)/GT,0,1); c.n.position.copy(pp.g.position).lerp(c.g.position,kk); c.n.material.opacity=(kk>0&&kk<1)?vis:0; } else c.n.material.opacity=0; });

  // ----- control rods -----
  const ri=rodIn(t), lvl=lerp(1.0,0.15,clamp((ri-0.15)/0.85,0,1));
  ctrl.position.copy(R).add(V(0,lerp(4.9,1.75,ri),0)); fuelM.emissiveIntensity=0.2+0.8*lvl; cher.material.opacity=0.55*lvl;
  rNeut.forEach((s,i)=>{ const d=s.userData; const on=(i/rNeut.length)<lvl; const tt=t*0.7+d.ph*10;
    const bx=(Math.abs(((d.x+tt*d.vx*0.3)%2+2)%2-1)), by=(Math.abs(((d.y+tt*d.vy*0.3)%2+2)%2-1)), bz=(Math.abs(((d.z+tt*d.vz*0.3)%2+2)%2-1));
    s.position.copy(R).add(V(-2.1+bx*4.2,0.2+by*3.2,-1.4+bz*2.8)); s.material.opacity=on?0.9:0; });

  // ----- plant -----
  const c=cut(t); concF.opacity=lerp(1,0.08,c); concF.depthWrite=c<0.5;
  coreM.opacity=0.6+0.3*Math.sin(t*4); coreGlow.material.opacity=0.6*priOn(t)+0.2;
  const po=priOn(t), so=secOn(t), co=coolOn(t), eo=elecOn(t);
  fP.forEach(s=>{ const u=(s.userData.ph+t*0.12)%1; primary.getPointAt(u,s.position); priCol(u,s.material.color); s.material.opacity=0.9*po; });
  fS.forEach(s=>{ const u=(s.userData.ph+t*0.09)%1; secondary.getPointAt(u,s.position); secCol(u,s.material.color); s.material.opacity=0.85*so; s.scale.setScalar(u<0.6&&u>0.1?0.5:0.34); });
  fC.forEach(s=>{ const u=(s.userData.ph+t*0.1)%1; cooling.getPointAt(u,s.position); s.material.color.setHex(0x8fe4ff); s.material.opacity=0.8*co; });
  const turAng=integ(0,t,x=>9*turOn(x)); turb.children.forEach(d=>d.rotation.x=turAng); tShaft.rotation.x=0;
  bladeM.emissiveIntensity=0.3*win(L(8).start,L(8).start+3.5,t);
  genM.emissiveIntensity=0.5*eo*(0.8+0.2*Math.sin(t*12)); genGlow.material.opacity=0.6*eo;
  sparks.forEach(s=>{ const u=(s.userData.ph+t*0.35)%1; wireCurve.getPointAt(u,s.position); s.material.opacity=eo; });
  winM.emissiveIntensity=eo*(0.6+1.4*night(t));
  const vp=Math.max(0.35,co);
  vapour.forEach(s=>{ const d=s.userData, k=(t*0.12+d.ph)%1; s.position.copy(TW).add(V(Math.cos(d.a)*d.r*1.6+k*4,10+k*7,Math.sin(d.a)*d.r*1.6)); s.scale.setScalar(2.5+k*6); s.material.opacity=vp*0.75*Math.sin(k*Math.PI); s.material.color.setHex(night(t)>0.5?0x9aa6c0:0xffffff); });

  renderer.render(scene,camera);

  // overlay
  let li=-1; LINES.forEach((l,i)=>{ if(t>=l.start-0.05) li=i; });
  const line=li>=0?LINES[li]:null;
  if(li!==lastLine){ sub.textContent=line?line.text:''; const cc=line&&CHIPS[line.m]; chip.textContent=cc||''; chip.style.display=cc?'inline-block':'none'; lastLine=li; }
  sub.style.opacity=(line && t<=line.end+0.3 && line.m!=='outro')?1:0;
  { let fo=0, fi=-1; for(const k in FACTS){ const l=L(+k), nx=LINES[+k+1]; const end=nx?nx.start-0.15:l.end; const o=win(l.start+0.9,end,t,0.35); if(o>fo){ fo=o; fi=+k; } }
    if(fi!==lastFact && fi>=0){ factv.textContent=FACTS[fi]; lastFact=fi; } factOp=fo; fact.style.opacity=fo; }
  head.style.opacity=smooth(L(1).start-0.6,L(1).start,t)*(1-smooth(L(11).start-0.4,L(11).start,t));
  const intro=1-smooth(L(1).start-0.8,L(1).start-0.2,t), outro=smooth(L(11).start-0.2,L(11).start+0.4,t);
  if(outro>0){ big1.textContent="SPLITTING ATOMS"; big2.innerHTML="TO LIGHT UP<br><em>CITIES</em>"; big.style.opacity=outro; }
  else { big1.textContent="TINY PELLET, HUGE POWER"; big2.innerHTML="HOW DOES <em>NUCLEAR</em><br>POWER WORK?"; big.style.opacity=intro; }
  document.getElementById('bar').style.width=(t/DURATION*100)+'%';
  const cw=W(), chh=H();
  LBL.forEach(l=>{ const o=win(l.from,l.to,t,0.3); if(o<0.01){ l.d.style.display='none'; return; }
    tmp.copy(l.p()).project(camera); l.d.style.display=tmp.z<1?'block':'none'; l.d.style.opacity=o;
    const hw=l.d.offsetWidth/2+8; l.d.style.left=clamp((tmp.x+1)/2*cw,hw,cw-hw)+'px'; l.d.style.top=clamp((1-tmp.y)/2*chh,chh*(factOp>0.05?0.29:0.22),chh*0.66)+'px'; });
}
window.renderAt=renderAt; window.DURATION=DURATION;
function resize(){ renderer.setSize(W(),H()); camera.aspect=W()/H(); camera.fov=camera.aspect<1?62:45; camera.updateProjectionMatrix(); }
window.addEventListener('resize',resize); resize();
if(location.hash==='#capture'){ document.body.classList.add('capture'); renderAt(0); }
else { let start=performance.now(); document.getElementById('replay').onclick=()=>{start=performance.now();};
  (function loop(){ renderAt(Math.min((performance.now()-start)/1000,DURATION)); requestAnimationFrame(loop); })(); }
})();
